name: EarnSmart India Daily Post

on:
  workflow_dispatch:
  schedule:
    # 9:00 AM India time = 3:30 AM UTC
    - cron: "30 3 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@LegitEarnIndia"
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          date = now.strftime("%d %B %Y")

          # 7-day rotating content
          posts = [

              {
                  "title": "💻 Freelancing: Start With ONE Skill",
                  "image": "https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=1200&q=80",
                  "body": """
🚀 <b>How to start:</b>

1️⃣ Choose one useful skill.
2️⃣ Create 2–3 sample works.
3️⃣ Build a simple portfolio.
4️⃣ Contact genuine clients.
5️⃣ Start with small projects.
6️⃣ Collect reviews and improve.

💡 <b>Tip:</b> Don't try to learn everything at once. Become useful at ONE skill first.

⚠️ Never pay money for a guaranteed freelance job.
"""
              },

              {
                  "title": "📚 Online Tutoring: Turn Knowledge Into Income",
                  "image": "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=80",
                  "body": """
🎓 If you are strong in a subject, online tutoring can become a genuine income source.

<b>You can teach:</b>

• School subjects
• English
• Mathematics
• Computer basics
• Programming
• Exam preparation

🚀 <b>Start:</b>

1️⃣ Choose your strongest subject.
2️⃣ Prepare simple lessons.
3️⃣ Decide your hourly rate.
4️⃣ Find students through legitimate platforms or your network.
5️⃣ Build trust through good teaching.

⚠️ Avoid anyone asking for a large upfront fee promising guaranteed students.
"""
              },

              {
                  "title": "🏠 Remote Work: Find Real Online Jobs",
                  "image": "https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=1200&q=80",
                  "body": """
💼 Remote work allows you to work for legitimate companies without travelling to an office.

<b>Common areas:</b>

• Customer support
• Virtual assistance
• Data-related work
• Software development
• Design
• Sales
• Content work

🔎 <b>Before applying:</b>

1️⃣ Prepare a professional CV.
2️⃣ Create a portfolio where relevant.
3️⃣ Research the employer.
4️⃣ Apply through legitimate channels.
5️⃣ Never pay for a promised job.

🚨 <b>Scam warning:</b>
A genuine employer normally does not demand money simply to give you a job.
"""
              },

              {
                  "title": "✍️ Content Writing: Earn With Your Writing Skill",
                  "image": "https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=1200&q=80",
                  "body": """
📝 Businesses need articles, blogs, product descriptions and social-media content.

🚀 <b>How to start:</b>

1️⃣ Choose a topic you understand.
2️⃣ Write 2–3 sample articles.
3️⃣ Create a simple portfolio.
4️⃣ Contact genuine clients.
5️⃣ Start with manageable projects.
6️⃣ Improve your writing continuously.

💡 Good writing solves a business problem — it isn't just about writing lots of words.

⚠️ Never pay someone because they promise guaranteed writing income.
"""
              },

              {
                  "title": "🎨 Graphic Design: Start Small",
                  "image": "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=80",
                  "body": """
🎨 Graphic design can be useful for businesses, creators and local shops.

<b>Beginner services can include:</b>

• Social-media posts
• YouTube thumbnails
• Posters
• Business flyers
• Simple logos
• Presentation designs

🚀 <b>Simple plan:</b>

1️⃣ Learn one design tool.
2️⃣ Create 5 sample designs.
3️⃣ Make a portfolio.
4️⃣ Contact small businesses.
5️⃣ Start with small projects.
6️⃣ Build reviews and increase your rates.

💡 Focus on solving the customer's problem rather than simply making something attractive.
"""
              },

              {
                  "title": "📱 Social Media Management: A Beginner Opportunity",
                  "image": "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80",
                  "body": """
📲 Many small businesses need help managing their social-media pages.

<b>You can offer:</b>

• Post creation
• Caption writing
• Content calendars
• Basic page management
• Comment/reply management
• Simple analytics reports

🚀 <b>Start:</b>

1️⃣ Learn the basics.
2️⃣ Create sample posts.
3️⃣ Choose a business niche.
4️⃣ Contact local businesses.
5️⃣ Offer a small trial project.
6️⃣ Build long-term relationships.

⚠️ Avoid clients who ask you to pay money before giving you work.
"""
              },

              {
                  "title": "🌐 Website Skills: Build a Valuable Online Skill",
                  "image": "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1200&q=80",
                  "body": """
💻 Website skills can create opportunities for freelance and small-business work.

<b>Begin with:</b>

• WordPress
• Basic HTML/CSS
• Website editing
• Landing pages
• Website maintenance
• Basic SEO

🚀 <b>Simple roadmap:</b>

1️⃣ Learn one area.
2️⃣ Build 2–3 demo websites.
3️⃣ Create a portfolio.
4️⃣ Find genuine businesses.
5️⃣ Offer a clearly defined service.
6️⃣ Improve your skills with every project.

💡 A useful skill + real clients + consistent work is a much safer path than "quick money" schemes.
"""
              }
          ]

          # Select today's post
          day_number = now.timetuple().tm_yday
          post = posts[(day_number - 1) % len(posts)]

          caption = f"""
💰 <b>EarnSmart India — Daily Earning Tip</b>

📅 {date}

<b>{post["title"]}</b>

{post["body"]}

━━━━━━━━━━━━━━
🔔 Follow <b>EarnSmart India</b> for practical online earning ideas.

#EarnSmartIndia #OnlineEarning #WorkFromHome #OnlineJobs
"""

          api = f"https://api.telegram.org/bot{TOKEN}/sendPhoto"

          data = urllib.parse.urlencode({
              "chat_id": CHAT_ID,
              "photo": post["image"],
              "caption": caption,
              "parse_mode": "HTML"
          }).encode()

          request = urllib.request.Request(
              api,
              data=data,
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode())

              if not result.get("ok"):
                  raise RuntimeError(result)

              print("✅ Daily image post published successfully.")
              print("📅 Date:", date)
              print("📝 Topic:", post["title"])

          except Exception as e:
              print("❌ Telegram publishing failed:", e)
              raise

          PY
