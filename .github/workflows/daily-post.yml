          # ==========================================================
          # HELPERS
          # ==========================================================

          def request_json(method, data=None):
              url = f"{API}/{method}"

              encoded = urllib.parse.urlencode(
                  data or {}
              ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=encoded,
                  method="POST",
                  headers={
                      "Content-Type":
                      "application/x-www-form-urlencoded",
                      "User-Agent":
                      "EarnSmartIndia-GitHubActions/2.0",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=TIMEOUT,
                  ) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw)

              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"HTTP {exc.code}: {body}"
                  )

          def escape(value):
              return html.escape(
                  str(value),
                  quote=False
              )

          # ==========================================================
          # TELEGRAM BOT TEST
          # ==========================================================

          def verify_bot():
              print("")
              print("Checking Telegram bot...")

              result = request_json("getMe")

              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram getMe failed: "
                      + str(result)
                  )

              bot = result.get("result", {})

              print(
                  "Bot verified: @"
                  + str(bot.get("username", "unknown"))
              )

          # ==========================================================
          # CHAT TEST
