          # ==========================================================
          # HELPERS
          # ==========================================================

          def escape_text(value):
              return html.escape(
                  str(value),
                  quote=False
              )


          def telegram_call(method, data=None):
              """
              Call Telegram API using POST.
              """

              if data is None:
                  data = {}

              encoded = urllib.parse.urlencode(
                  data
              ).encode("utf-8")

              request = urllib.request.Request(
                  f"{API_URL}/{method}",
                  data=encoded,
                  method="POST",
                  headers={
                      "Content-Type":
                          "application/x-www-form-urlencoded",
                      "User-Agent":
                          "EarnSmartIndia/2.0",
                  },
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=TELEGRAM_TIMEOUT,
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                      result = json.loads(raw)

                      return result

              except urllib.error.HTTPError as error:

                  raw = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "Telegram HTTP ERROR:"
                  )

                  print(raw)

                  raise

              except Exception as error:

                  print(
                      f"Telegram connection error: {error}"
                  )

                  raise


          # ==========================================================
          # VERIFY BOT
          # ==========================================================

          def verify_bot():

              print()
              print("Checking Telegram bot...")

              result = telegram_call(
                  "getMe"
              )

              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              if not result.get("ok"):

                  description = result.get(
                      "description",
                      "Unknown Telegram error"
                  )

                  raise RuntimeError(
                      "Telegram bot verification failed: "
                      + description
                  )

              bot = result.get(
                  "result",
                  {}
              )

              username = bot.get(
                  "username",
                  "unknown"
              )

              print(
                  f"Bot verified: @{username}"
              )


          # ==========================================================
