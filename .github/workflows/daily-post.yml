- name: Generate and publish daily post
  env:
    TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    TELEGRAM_CHAT_ID: "@LegitEarnIndia"

  run: |
    python - <<'PY'
    import os
    import json
    import urllib.request
    import urllib.parse
    import urllib.error
    from datetime import datetime
    from zoneinfo import ZoneInfo

    TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
    CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

    # India date
    now = datetime.now(ZoneInfo("Asia/Kolkata"))
    date = now.strftime("%d %B %Y")

    # -----------------------------------------
    # DAILY CONTENT
    # -----------------------------------------

    posts = [

        {
            "title": "💻 Freelancing: Start With Your Skills",
            "body": """
    🚀 <b>How to start:</b>

    1️⃣ Choose one useful skill.
    2️⃣ Create 2–3 sample works.
    3️⃣ Build a simple portfolio.
    4️⃣ Contact genuine clients.
    5️⃣ Start with small projects.
    6️⃣ Collect reviews and improve.

    💡 <b>Tip:</b>
    Don't try to learn everything at once. Become useful at ONE skill first.

    ⚠️ Never pay money for a guaranteed freelance job.
            """
        },

        {
            "title": "🎓 Online Tutoring: Turn Knowledge Into Income",
            "body": """
    📚 If you are good at a subject, online tutoring can become a genuine income source.

    <b>You can teach:</b>

    • School subjects
    • English
    • Mathematics
    • Computer basics
    • Programming
    • Competitive-exam subjects

    🚀 <b>Start:</b>

    1️⃣ Choose your strongest subject.
    2️⃣ Prepare simple lessons.
    3️⃣ Decide your hourly rate.
    4️⃣ Find students through legitimate channels.
    5️⃣ Build your reputation through good teaching.

    ⚠️ Avoid anyone promising guaranteed students for an upfront payment.
            """
        },

        {
            "title": "🌐 Website & Blog: Build a Long-Term Asset",
            "body": """
    💻 A useful website can become a long-term online asset.

    <b>Possible topics:</b>

    • Technology
    • Education
    • Finance basics
    • Jobs
    • Tutorials
    • Local information

    🚀 <b>Basic plan:</b>

    1️⃣ Pick one clear topic.
    2️⃣ Publish genuinely useful content.
    3️⃣ Learn basic SEO.
    4️⃣ Build traffic gradually.
    5️⃣ Explore legitimate monetization options.

    💡 Don't expect instant income. Traffic and trust take time.
            """
        },

        {
            "title": "📱 Learn a Digital Skill",
            "body": """
    🚀 Digital skills can create opportunities for freelance and remote work.

    <b>Skills worth exploring:</b>

    • Graphic design
    • Video editing
    • WordPress
    • Web development
    • Content writing
    • Translation
    • Social media management

    🎯 Pick ONE skill and practise it consistently.

    💡 Your goal should be to become useful enough that someone is willing to pay for your work.
            """
        },

        {
            "title": "🏠 Remote Work: Find Real Opportunities",
            "body": """
    💼 Remote work can provide legitimate income without travelling to an office.

    <b>Common areas include:</b>

    • Customer support
    • Virtual assistance
    • Data-related work
    • Software development
    • Design
    • Sales
    • Content work

    🚀 <b>Before applying:</b>

    1️⃣ Prepare a professional CV.
    2️⃣ Create a portfolio where relevant.
    3️⃣ Research the employer.
    4️⃣ Apply through legitimate channels.
    5️⃣ Never pay money to receive a job.

    ⚠️ A genuine employer should not demand money simply to give you a job.
            """
        },

        {
            "title": "🛠️ Sell a Digital Service",
            "body": """
    💡 Instead of looking only for jobs, you can offer a useful service.

    <b>Examples:</b>

    • Logo design
    • Video editing
    • Website setup
    • WordPress customization
    • Resume formatting
    • Translation
    • Social media posts

    🚀 Start small.

    Create 2–3 examples of your work, show them to potential clients and improve your service based on feedback.

    ⚠️ Avoid clients who ask you to pay money before giving you work.
            """
        },

        {
            "title": "💰 Build Income Slowly and Safely",
            "body": """
    📈 Sustainable online income usually doesn't happen overnight.

    <b>A simple approach:</b>

    1️⃣ Learn a useful skill.
    2️⃣ Practise regularly.
    3️⃣ Create proof of your ability.
    4️⃣ Find genuine customers or employers.
    5️⃣ Deliver good work.
    6️⃣ Increase your rates as your experience grows.

    💡 Avoid "double your money", guaranteed-income and deposit-based schemes.

    🛡️ Protect your OTPs, passwords and private wallet keys.
            """
        }
    ]

    # -----------------------------------------
    # SELECT DAILY POST
    # -----------------------------------------

    post = posts[(now.timetuple().tm_yday - 1) % len(posts)]

    title = post["title"]

    # -----------------------------------------
    # CREATE IMAGE
    # -----------------------------------------

    try:
        from PIL import Image, ImageDraw, ImageFont

        W, H = 1200, 675

        image = Image.new("RGB", (W, H), "#101820")
        draw = ImageDraw.Draw(image)

        # Background
        for y in range(H):
            r = int(15 + (y / H) * 25)
            g = int(30 + (y / H) * 35)
            b = int(45 + (y / H) * 45)
            draw.line((0, y, W, y), fill=(r, g, b))

        # Decorative circles
        draw.ellipse((850, -150, 1350, 350), fill=(30, 90, 120))
        draw.ellipse((-180, 480, 280, 900), fill=(20, 70, 90))

        # Fonts
        font_big = ImageFont.truetype(
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
            58
        )

        font_small = ImageFont.truetype(
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
            30
        )

        font_brand = ImageFont.truetype(
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
            34
        )

        # Brand
        draw.text(
            (70, 55),
            "EarnSmart India",
            font=font_brand,
            fill="white"
        )

        draw.text(
            (70, 105),
            "DAILY EARNING TIP",
            font=font_small,
            fill="#B8DCE8"
        )

        # Title wrapping
        words = title.split()
        lines = []
        line = ""

        for word in words:
            test = line + " " + word if line else word

            if draw.textbbox((0, 0), test, font=font_big)[2] < 1050:
                line = test
            else:
                lines.append(line)
                line = word

        if line:
            lines.append(line)

        y = 220

        for line in lines[:4]:
            draw.text(
                (70, y),
                line,
                font=font_big,
                fill="white"
            )
            y += 75

        # Date
        draw.text(
            (70, 570),
            date,
            font=font_small,
            fill="#D4E7ED"
        )

        # Bottom branding
        draw.text(
            (820, 585),
            "#EarnSmartIndia",
            font=font_small,
            fill="white"
        )

        image.save("daily_post.jpg", "JPEG", quality=94)

        print("✅ Image created")

    except Exception as e:
        print("❌ Image generation failed:", e)
        raise

    # -----------------------------------------
    # TELEGRAM SEND PHOTO
    # -----------------------------------------

    caption = f"""
💰 <b>EarnSmart India — Daily Earning Tip</b>

📅 {date}

<b>{title}</b>

{post["body"].strip()}

💡 <b>Remember:</b>
There is no guaranteed easy-money method. Legitimate online income normally requires skill, effort, consistency and patience.

📢 Follow <b>EarnSmart India</b> for practical online earning tips.

#EarnSmartIndia #OnlineEarning #WorkFromHome #OnlineJobs
"""

    url = f"https://api.telegram.org/bot{TOKEN}/sendPhoto"

    boundary = "----EarnSmartBoundary"

    def field(name, value):
        return (
            f"--{boundary}\r\n"
            f'Content-Disposition: form-data; name="{name}"\r\n\r\n'
            f"{value}\r\n"
        ).encode()

    body = b""

    body += field("chat_id", CHAT_ID)
    body += field("caption", caption)
    body += field("parse_mode", "HTML")

    body += (
        f"--{boundary}\r\n"
        f'Content-Disposition: form-data; name="photo"; filename="daily_post.jpg"\r\n'
        f"Content-Type: image/jpeg\r\n\r\n"
    ).encode()

    with open("daily_post.jpg", "rb") as f:
        body += f.read()

    body += f"\r\n--{boundary}--\r\n".encode()

    request = urllib.request.Request(
        url,
        data=body,
        method="POST",
        headers={
            "Content-Type": f"multipart/form-data; boundary={boundary}"
        }
    )

    try:
        with urllib.request.urlopen(request, timeout=60) as response:
            result = json.loads(response.read().decode())

        if not result.get("ok"):
            raise RuntimeError(result)

        print("✅ Telegram post published successfully")
        print("📅 Date:", date)
        print("📝 Topic:", title)

    except urllib.error.HTTPError as e:
        error_body = e.read().decode(errors="replace")
        print("❌ Telegram HTTP error:", e.code)
        print(error_body)
        raise

    PY
