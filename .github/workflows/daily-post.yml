name: EarnSmart India Daily Post

"on":
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -Eeuo pipefail

          # ============================================
          # CONFIG
          # ============================================
          BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
          CHAT_ID="@LegitEarnIndia"
          API="https://api.telegram.org/bot${BOT_TOKEN}"

          # ============================================
          # DAILY TOPICS (simplified for Bash)
          # Each entry: title|intro|image_url|job_description|skills|improve|sources|links
          # We'll store them as separate arrays for clarity, or use a single array with delimiter.
          # For simplicity, we'll just pick one fixed topic for testing, then expand later.
          # But to keep it functional, we'll define arrays for titles, intros, images, etc.

          # Define topics (you can add all 19; I'll include a few examples)
          # Format: one string per field, separated by '|'
          # We'll use parallel arrays.

