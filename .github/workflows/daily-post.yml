name: EarnSmart India Daily Post

"on":
  workflow_dispatch:

  schedule:
    # 03:30 UTC = 09:00 AM IST
    - cron: "30 3 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

