              )

              lines.append("")

              lines.append(
                  "Start small, build one useful skill and improve "
                  "your results consistently."
              )

              lines.append("")

              lines.append(
                  "#EarnSmartIndia "
                  "#OnlineEarning "
                  "#FreelancingIndia "
                  "#DigitalSkills "
                  "#WorkFromHome"
              )

              caption = "\n".join(lines)

              # Telegram photo caption limit
              if len(caption) > MAX_CAPTION_LENGTH:

                  caption = (
                      caption[:MAX_CAPTION_LENGTH - 100]
                      .rstrip()
                      + "\n\n"
                      "#EarnSmartIndia "
                      "#OnlineEarning"
                  )

              return caption


