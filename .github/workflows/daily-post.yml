          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          if not CHAT_ID:
              print("ERROR: TELEGRAM_CHAT_ID secret is missing.")
              sys.exit(1)

          API_BASE = f"https://api.telegram.org/bot{TOKEN}"

