name: EarnSmart India Daily Post

on:
  workflow_dispatch:

  schedule:
    # 9:00 AM India time = 3:30 AM UTC
    - cron: "30 3 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@LegitEarnIndia"

        run: |
          python - <<'PY'
          import os
          import sys
          import html
          import json
          import time
          import urllib.request
          import urllib.error
          import uuid
          from datetime import datetime
          from zoneinfo import ZoneInfo

          # ============================================================
          # CONFIGURATION
          # ============================================================

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          if not CHAT_ID:
              print("ERROR: TELEGRAM_CHAT_ID is missing.")
              sys.exit(1)

          # ============================================================
          # INDIA DATE
          # ============================================================

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          date_text = now.strftime("%d %B %Y")

          # Monday = 0 ... Sunday = 6
          day_number = now.weekday()

          # ============================================================
          # 7-DAY CONTENT ROTATION
          # ============================================================

          posts = [

              {
                  "title": "🌐 Website & Blog: Build a Long-Term Asset",
                  "image": "https://picsum.photos/seed/earnsmart-website/1200/800",
                  "intro": "💻 A useful website can become a long-term online asset.",
                  "sections": [
                      (
                          "Possible topics",
                          [
                              "Technology",
                              "Education",
                              "Finance basics",
                              "Jobs",
                              "Tutorials",
                              "Local information"
                          ]
                      ),
                      (
                          "🚀 Basic plan",
                          [
                              "Pick one clear topic.",
                              "Publish genuinely useful content.",
                              "Learn basic SEO.",
                              "Build traffic gradually.",
                              "Explore legitimate monetization options."
                          ]
                      )
                  ],
                  "warning": "Don't expect instant income. Traffic and trust take time."
              },

              {
                  "title": "💻 Freelancing: Start With One Useful Skill",
                  "image": "https://picsum.photos/seed/earnsmart-freelancing/1200/800",
                  "intro": "🚀 Freelancing can become an income source when you develop a useful skill and find genuine clients.",
                  "sections": [
                      (
                          "Popular skills",
                          [
                              "Graphic design",
                              "Video editing",
                              "Content writing",
                              "Web development",
                              "Virtual assistance",
                              "Data-related work"
                          ]
                      ),
                      (
                          "🚀 Getting started",
                          [
                              "Choose one skill.",
                              "Practice regularly.",
                              "Create 2–3 sample projects.",
                              "Build a simple portfolio.",
                              "Start with small legitimate projects."
                          ]
                      )
                  ],
                  "warning": "Never pay money to someone promising a guaranteed freelance job."
              },

              {
                  "title": "🏠 Remote Work: Find Legitimate Online Jobs",
                  "image": "https://picsum.photos/seed/earnsmart-remote/1200/800",
                  "intro": "💼 Remote work can provide legitimate income when you have the right skills.",
                  "sections": [
                      (
                          "Common areas",
                          [
                              "Customer support",
                              "Virtual assistance",
                              "Data-related work",
                              "Software development",
                              "Design",
                              "Sales",
                              "Content work"
                          ]
                      ),
                      (
                          "🚀 Before applying",
                          [
                              "Prepare a professional CV.",
                              "Create a portfolio where relevant.",
                              "Apply through legitimate company websites or platforms.",
                              "Research the employer.",
                              "Never pay for a guaranteed job."
                          ]
                      )
                  ],
                  "warning": "Genuine employers normally don't demand money simply to give you a job."
              },

              {
                  "title": "📱 Learn a Digital Skill Using Your Phone",
                  "image": "https://picsum.photos/seed/earnsmart-phone/1200/800",
                  "intro": "📚 A smartphone can be useful for learning skills that may later help you earn online.",
                  "sections": [
                      (
                          "Skills to consider",
                          [
                              "Canva design",
                              "Video editing",
                              "Content writing",
                              "Social media management",
                              "Basic coding",
                              "Digital marketing"
                          ]
                      ),
                      (
                          "🚀 Simple routine",
                          [
                              "Choose one skill.",
                              "Learn for 30–60 minutes daily.",
                              "Practice with real examples.",
                              "Create sample work.",
                              "Improve based on feedback."
                          ]
                      )
                  ],
                  "warning": "Learning takes time. Avoid courses that promise guaranteed income."
              },

              {
                  "title": "🛒 Online Selling: Start Small",
                  "image": "https://picsum.photos/seed/earnsmart-selling/1200/800",
                  "intro": "📦 Selling useful products or services online can become a legitimate business when managed carefully.",
                  "sections": [
                      (
                          "Things to consider",
                          [
                              "Choose a product people actually need.",
                              "Compare supplier prices.",
                              "Calculate delivery and platform costs.",
                              "Use clear product photos.",
                              "Provide honest descriptions."
                          ]
                      ),
                      (
                          "🚀 Start carefully",
                          [
                              "Begin with a small budget.",
                              "Test demand first.",
                              "Track every expense.",
                              "Keep customer records.",
                              "Reinvest only after understanding your margins."
                          ]
                      )
                  ],
                  "warning": "Never assume every product or business model will be profitable."
              },

              {
                  "title": "🎨 Turn a Skill Into a Simple Service",
                  "image": "https://picsum.photos/seed/earnsmart-service/1200/800",
                  "intro": "💡 One practical skill can sometimes be packaged into a simple service for individuals or small businesses.",
                  "sections": [
                      (
                          "Example services",
                          [
                              "Poster design",
                              "Short video editing",
                              "Website setup",
                              "Social media posts",
                              "Resume formatting",
                              "Basic data entry"
                          ]
                      ),
                      (
                          "🚀 How to begin",
                          [
                              "Select one service.",
                              "Create sample work.",
                              "Set a clear starting price.",
                              "Show your work professionally.",
                              "Ask satisfied customers for reviews."
                          ]
                      )
                  ],
                  "warning": "Avoid copying other people's work or making unrealistic promises."
              },

              {
                  "title": "💰 Build Multiple Legitimate Income Skills",
                  "image": "https://picsum.photos/seed/earnsmart-skills/1200/800",
                  "intro": "📈 A stronger long-term strategy is to build useful skills instead of searching for instant-money schemes.",
                  "sections": [
                      (
                          "Useful areas",
                          [
                              "Freelancing",
                              "Content creation",
                              "Websites",
                              "Digital services",
                              "Online selling",
                              "Remote employment"
                          ]
                      ),
                      (
                          "🚀 Long-term approach",
                          [
                              "Learn one skill first.",
                              "Get practical experience.",
                              "Build proof of your work.",
                              "Find legitimate opportunities.",
                              "Gradually add another complementary skill."
                          ]
                      )
                  ],
                  "warning": "There is no guaranteed easy-money method. Skill, effort and consistency matter."
              }
          ]

          post = posts[day_number % len(posts)]

          # ============================================================
          # HTML ESCAPING
          # ============================================================

          def esc(value):
              return html.escape(str(value), quote=False)

          # ============================================================
          # BUILD TELEGRAM CAPTION
          # ============================================================

          parts = []

          parts.append(
              "<b>💰 EarnSmart India — Daily Earning Tip</b>"
          )

          parts.append(
              f"📅 {esc(date_text)}"
          )

          parts.append(
              f"<b>{esc(post['title'])}</b>"
          )

          parts.append(
              esc(post["intro"])
          )

          for heading, items in post["sections"]:
              parts.append("")
              parts.append(f"<b>{esc(heading)}:</b>")

              for item in items:
                  parts.append(f"• {esc(item)}")

          parts.append("")
          parts.append(
              f"🚨 <b>Scam warning:</b> {esc(post['warning'])}"
          )

          parts.append("")
          parts.append(
              "💡 <b>Remember:</b>\n"
              "Legitimate online income normally requires "
              "skill, effort, consistency and patience."
          )

          parts.append("")
          parts.append(
              "📢 <b>Follow EarnSmart India</b> for practical "
              "online earning tips."
          )

          parts.append("")
          parts.append(
              "#EarnSmartIndia #OnlineEarning "
              "#WorkFromHome #OnlineJobs"
          )

          caption = "\n".join(parts)

          # Telegram photo captions have a 1024-character limit.
          # Keep a safe margin.
          if len(caption) > 1000:
              caption = caption[:997] + "..."

          print("Selected topic:")
          print(post["title"])
          print("Caption length:", len(caption))

          # ============================================================
          # DOWNLOAD IMAGE
          # ============================================================

          image_path = "/tmp/earnsmart_daily.jpg"

          print("Downloading image...")

          image_request = urllib.request.Request(
              post["image"],
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          try:
              with urllib.request.urlopen(image_request, timeout=60) as response:
                  image_data = response.read()

              if not image_data:
                  raise RuntimeError("Downloaded image is empty.")

              with open(image_path, "wb") as image_file:
                  image_file.write(image_data)

              print("Image downloaded successfully.")
              print("Image size:", len(image_data), "bytes")

          except Exception as e:
              print("ERROR: Image download failed:", e)
              sys.exit(1)

          # ============================================================
          # TELEGRAM SEND PHOTO
          # ============================================================

          api_url = (
              f"https://api.telegram.org/bot{TOKEN}/sendPhoto"
          )

          def make_field(name, value, boundary):
              return (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; name="{name}"\r\n'
                  f"\r\n"
                  f"{value}\r\n"
              ).encode("utf-8")

          def make_file_field(
              name,
              filename,
              file_data,
              content_type,
              boundary
          ):
              header = (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; '
                  f'name="{name}"; filename="{filename}"\r\n'
                  f"Content-Type: {content_type}\r\n"
                  f"\r\n"
              ).encode("utf-8")

              return header + file_data + b"\r\n"

          def send_telegram_photo():
              boundary = "----EarnSmartIndia" + uuid.uuid4().hex

              with open(image_path, "rb") as image_file:
                  file_data = image_file.read()

              body = b""

              body += make_field(
                  "chat_id",
                  CHAT_ID,
                  boundary
              )

              body += make_field(
                  "caption",
                  caption,
                  boundary
              )

              body += make_field(
                  "parse_mode",
                  "HTML",
                  boundary
              )

              body += make_file_field(
                  "photo",
                  "earnsmart-daily.jpg",
                  file_data,
                  "image/jpeg",
                  boundary
              )

              body += (
                  f"--{boundary}--\r\n"
              ).encode("utf-8")

              request = urllib.request.Request(
                  api_url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type":
                          f"multipart/form-data; boundary={boundary}",
                      "Content-Length": str(len(body)),
                      "User-Agent": "EarnSmartIndia-GitHubActions/1.0"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=90
                  ) as response:

                      raw = response.read().decode("utf-8")

                  result = json.loads(raw)

                  if not result.get("ok"):
                      raise RuntimeError(
                          "Telegram API returned an error: "
                          + raw
                      )

                  print("")
                  print("========================================")
                  print("SUCCESS: Telegram post published.")
                  print("========================================")
                  print("Message ID:",
                        result.get("result", {}).get("message_id"))

                  return True

              except urllib.error.HTTPError as e:
                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("")
                  print("Telegram HTTP error:", e.code)
                  print(error_body)

                  return False

              except Exception as e:
                  print("Telegram request failed:", e)
                  return False

          # ============================================================
          # RETRY
          # ============================================================

          success = False

          for attempt in range(1, 4):

              print(
                  f"Sending Telegram post "
                  f"(attempt {attempt}/3)..."
              )

              if send_telegram_photo():
                  success = True
                  break

              if attempt < 3:
                  print("Waiting 5 seconds before retry...")
                  time.sleep(5)

          if not success:
              print("")
              print("ERROR: Telegram publishing failed after 3 attempts.")
              sys.exit(1)

          print("")
          print("Daily post completed successfully.")
          PY
