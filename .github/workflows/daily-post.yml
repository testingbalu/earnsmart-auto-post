name: EarnSmart India Daily Post

on:
  workflow_dispatch:

  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ============================================================
      # TELEGRAM PUBLISHER
      # ============================================================

      - name: Generate and publish daily post
        shell: bash

        env:
          # Only this value needs to be stored in GitHub Secrets.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          # DO NOT create TELEGRAM_CHAT_ID secret.
          # Keep your working Telegram channel username here.
          TELEGRAM_CHAT_ID: "@LegitEarnIndia"

        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "EarnSmart India Telegram Publisher"
          echo "=================================================="

          # ----------------------------------------------------------
          # CHECK BOT TOKEN
          # ----------------------------------------------------------

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is missing."
            echo ""
            echo "Go to:"
            echo "Settings -> Secrets and variables -> Actions"
            echo ""
            echo "Create:"
            echo "TELEGRAM_BOT_TOKEN"
            exit 1
          fi

          # ----------------------------------------------------------
          # CHECK CHANNEL
          # ----------------------------------------------------------

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "ERROR: Telegram channel is missing."
            exit 1
          fi

          echo "Telegram bot token: FOUND"
          echo "Telegram target: ${TELEGRAM_CHAT_ID}"

          # ==========================================================
          # CREATE PYTHON SCRIPT
          # ==========================================================

          cat > /tmp/daily_post.py <<'PY'

