          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone

          # ============================================================
          # CONFIGURATION
          # ============================================================

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = "@LegitEarnIndia"

          if not BOT_TOKEN:
              raise RuntimeError(
                  "TELEGRAM_BOT_TOKEN secret is missing from GitHub Secrets."
              )

          API_URL = "https://api.telegram.org/bot" + BOT_TOKEN

          # ============================================================
          # TELEGRAM API HELPER
          # ============================================================

          def telegram_request(method, data):
              url = API_URL + "/" + method

              encoded = urllib.parse.urlencode(data).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=encoded,
                  method="POST",
                  headers={
                      "Content-Type": "application/x-www-form-urlencoded"
                  }
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      result = json.loads(raw)

              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")

                  raise RuntimeError(
                      "Telegram HTTP error "
                      + str(error.code)
                      + ": "
                      + body
                  )

              except urllib.error.URLError as error:
                  raise RuntimeError(
                      "Telegram connection error: "
                      + str(error.reason)
                  )

              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram API rejected request: "
                      + json.dumps(result, ensure_ascii=False)
                  )

              return result

          # ============================================================
          # TEST BOT
          # ============================================================

          print("Checking Telegram bot...")

          bot_info = telegram_request("getMe", {})

          bot_username = bot_info["result"].get("username", "unknown")

          print("Telegram bot connected: @" + bot_username)

