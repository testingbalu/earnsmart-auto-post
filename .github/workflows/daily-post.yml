name: EarnSmart India Daily Post

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@LegitEarnIndia"

        run: |
          cat > /tmp/telegram_test.py <<'PYTHON_SCRIPT'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error
          import uuid
          import time

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          print("========================================")
          print("EarnSmart India Telegram Diagnostics")
          print("========================================")
          print()

          if not TOKEN:
              print("❌ TELEGRAM_BOT_TOKEN is EMPTY")
              sys.exit(1)

          if not CHAT_ID:
              print("❌ TELEGRAM_CHAT_ID is EMPTY")
              sys.exit(1)

          print("Bot token found: YES")
          print("Bot token length:", len(TOKEN))
          print("Target chat:", CHAT_ID)
          print()

          # ============================================================
          # TELEGRAM API HELPER
          # ============================================================

          def telegram_api(method, data=None):
              url = f"https://api.telegram.org/bot{TOKEN}/{method}"

              if data:
                  encoded = json.dumps(data).encode("utf-8")

                  request = urllib.request.Request(
                      url,
                      data=encoded,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "EarnSmartIndia/1.0"
                      }
                  )
              else:
                  request = urllib.request.Request(
                      url,
                      method="GET",
                      headers={
                          "User-Agent": "EarnSmartIndia/1.0"
                      }
                  )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      raw = response.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      result = json.loads(raw)

                      print("HTTP:", response.status)
                      print(
                          json.dumps(
                              result,
                              indent=2,
                              ensure_ascii=False
                          )
                      )

                      return result

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("❌ HTTP ERROR:", e.code)
                  print("Response:", body)

                  try:
                      return json.loads(body)
                  except Exception:
                      return {
                          "ok": False,
                          "description": body
                      }

              except Exception as e:

                  print("❌ REQUEST ERROR:", repr(e))

                  return {
                      "ok": False,
                      "description": str(e)
                  }

          # ============================================================
          # STEP 1 — VERIFY BOT TOKEN
          # ============================================================

          print()
          print("========================================")
          print("STEP 1: Checking bot token")
          print("========================================")

          bot_result = telegram_api("getMe")

          if not bot_result.get("ok"):
              print()
              print("❌ BOT TOKEN IS INVALID")
              sys.exit(1)

          bot = bot_result.get("result", {})

          print()
          print("✅ BOT TOKEN WORKS")
          print("Bot ID:", bot.get("id"))
          print("Bot username:", bot.get("username"))
          print("Bot name:", bot.get("first_name"))

          # ============================================================
          # STEP 2 — VERIFY CHANNEL
          # ============================================================

          print()
          print("========================================")
          print("STEP 2: Checking Telegram channel")
          print("========================================")

          chat_result = telegram_api(
              "getChat",
              {
                  "chat_id": CHAT_ID
              }
          )

          if not chat_result.get("ok"):
              print()
              print("❌ CANNOT ACCESS TARGET CHAT")
              print()
              print("Check that:")
              print("1. The username is correct.")
              print("2. The bot is inside the channel.")
              print("3. The bot is an administrator.")
              print("4. The channel username is correct.")
              sys.exit(1)

          chat = chat_result.get("result", {})

          print()
          print("✅ CHANNEL FOUND")
          print("Channel ID:", chat.get("id"))
          print("Channel type:", chat.get("type"))
          print("Channel title:", chat.get("title"))
          print("Channel username:", chat.get("username"))

          # ============================================================
          # STEP 3 — CHECK BOT ADMIN STATUS
          # ============================================================

          print()
          print("========================================")
          print("STEP 3: Checking bot administrator status")
          print("========================================")

          bot_id = bot.get("id")

          admin_result = telegram_api(
              "getChatMember",
              {
                  "chat_id": CHAT_ID,
                  "user_id": bot_id
              }
          )

          if not admin_result.get("ok"):
              print()
              print("❌ COULD NOT CHECK BOT ADMIN STATUS")
              sys.exit(1)

          member = admin_result.get("result", {})

          status = member.get("status")

          print()
          print("Bot status:", status)

          if status != "administrator":
              print()
              print("❌ BOT IS NOT AN ADMINISTRATOR")
              print()
              print("Add the bot as an administrator")
              print("inside your Telegram channel.")
              sys.exit(1)

          print("✅ BOT IS ADMINISTRATOR")

          # ============================================================
          # STEP 4 — TEST TEXT MESSAGE
          # ============================================================

          print()
          print("========================================")
          print("STEP 4: Sending test Telegram message")
          print("========================================")

          test_message = (
              "🧪 <b>EarnSmart India Test</b>\n\n"
              "Telegram connection is working.\n"
              "This message was sent automatically by GitHub Actions."
          )

          send_result = telegram_api(
              "sendMessage",
              {
                  "chat_id": CHAT_ID,
                  "text": test_message,
                  "parse_mode": "HTML"
              }
          )

          if not send_result.get("ok"):
              print()
              print("❌ TEST MESSAGE FAILED")
              print(
                  "Telegram:",
                  send_result.get("description")
              )
              sys.exit(1)

          message = send_result.get("result", {})

          print()
          print("✅ TEST MESSAGE SENT")
          print(
              "Message ID:",
              message.get("message_id")
          )

          # ============================================================
          # STEP 5 — CREATE TEST IMAGE
          # ============================================================

          print()
          print("========================================")
          print("STEP 5: Downloading test image")
          print("========================================")

          image_url = (
              "https://picsum.photos/seed/"
              "earnsmart-test/1200/800"
          )

          image_path = "/tmp/earnsmart_test.jpg"

          request = urllib.request.Request(
              image_url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0 EarnSmartIndia/1.0"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  image_data = response.read()

              with open(image_path, "wb") as f:
                  f.write(image_data)

              print(
                  "✅ Image downloaded:",
                  len(image_data),
                  "bytes"
              )

          except Exception as e:
              print("❌ IMAGE DOWNLOAD FAILED")
              print(repr(e))
              sys.exit(1)

          # ============================================================
          # STEP 6 — SEND PHOTO
          # ============================================================

          print()
          print("========================================")
          print("STEP 6: Sending photo to Telegram")
          print("========================================")

          boundary = (
              "----EarnSmartIndia"
              + uuid.uuid4().hex
          )

          with open(image_path, "rb") as f:
              file_data = f.read()

          body = b""

          body += (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; '
              f'name="chat_id"\r\n'
              f"\r\n"
              f"{CHAT_ID}\r\n"
          ).encode("utf-8")

          body += (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; '
              f'name="caption"\r\n'
              f"\r\n"
              f"<b>💰 EarnSmart India</b>\n"
              f"Daily earning test post.\n\n"
              f"#EarnSmartIndia\r\n"
          ).encode("utf-8")

          body += (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; '
              f'name="parse_mode"\r\n"
              f"\r\n"
              f"HTML\r\n"
          ).encode("utf-8")

          body += (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; '
              f'name="photo"; '
              f'filename="earnsmart-test.jpg"\r\n'
              f"Content-Type: image/jpeg\r\n"
              f"\r\n"
          ).encode("utf-8")

          body += file_data
          body += b"\r\n"

          body += (
              f"--{boundary}--\r\n"
          ).encode("utf-8")

          photo_url = (
              f"https://api.telegram.org/"
              f"bot{TOKEN}/sendPhoto"
          )

          photo_request = urllib.request.Request(
              photo_url,
              data=body,
              method="POST",
              headers={
                  "Content-Type":
                  f"multipart/form-data; "
                  f"boundary={boundary}",
                  "Content-Length":
                  str(len(body)),
                  "User-Agent":
                  "EarnSmartIndia/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  photo_request,
                  timeout=90
              ) as response:

                  raw = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  photo_result = json.loads(raw)

                  print()
                  print(
                      json.dumps(
                          photo_result,
                          indent=2,
                          ensure_ascii=False
                      )
                  )

          except urllib.error.HTTPError as e:

              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print()
              print("❌ TELEGRAM PHOTO HTTP ERROR")
              print("HTTP:", e.code)
              print("Response:", error_body)
              sys.exit(1)

          except Exception as e:

              print()
              print("❌ PHOTO REQUEST FAILED")
              print(repr(e))
              sys.exit(1)

          if not photo_result.get("ok"):

              print()
              print("❌ TELEGRAM REJECTED PHOTO")
              print(
                  "Error code:",
                  photo_result.get("error_code")
              )
              print(
                  "Description:",
                  photo_result.get("description")
              )

              sys.exit(1)

          print()
          print("========================================")
          print("🎉 SUCCESS")
          print("========================================")
          print()
          print(
              "Photo message ID:",
              photo_result
              .get("result", {})
              .get("message_id")
          )
          print()
          print("Telegram posting is working correctly.")
          PYTHON_SCRIPT

          echo "Checking Python syntax..."

          python -m py_compile /tmp/telegram_test.py

          echo "Python syntax OK."

          echo "Running Telegram diagnostics..."

          python /tmp/telegram_test.py
