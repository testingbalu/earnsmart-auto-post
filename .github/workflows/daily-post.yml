        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # TELEGRAM TEST + DAILY POST
      # ============================================================
      - name: Verify Telegram and publish post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "EarnSmart India Telegram Publisher"
          echo "=================================================="

          # ----------------------------------------------------------
          # CHECK SECRETS
          # ----------------------------------------------------------

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is missing."
            exit 1
          fi

          echo "Telegram bot token: PRESENT"
          echo "Telegram chat ID: ${TELEGRAM_CHAT_ID}"

