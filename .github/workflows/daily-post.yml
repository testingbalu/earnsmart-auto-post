name: EarnSmart India Daily Post

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and publish Telegram post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@LegitEarnIndia"
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json
          from datetime import datetime, timezone

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          today = datetime.now(timezone.utc).strftime("%d %B %Y")

          message = f"""💰 EarnSmart India — Daily Earning Tip

          📅 {today}

          💻 Freelancing: A Simple Way to Start Online

          If you have a useful skill such as writing, graphic design, video editing, translation, or website work, freelancing can be a legitimate way to earn online.

          🚀 Start with these steps:

          1️⃣ Choose ONE skill.
          2️⃣ Create 2–3 sample works.
          3️⃣ Build a simple portfolio.
          4️⃣ Find genuine clients.
          5️⃣ Complete small projects and collect reviews.
          6️⃣ Improve your skill and gradually increase your rates.

          ⚠️ Important:
          Never pay someone just because they promise guaranteed income. Avoid schemes asking for deposits, OTPs, passwords, or private wallet keys.

          💡 Real online income usually requires skill, effort and patience.

          Follow EarnSmart India for more practical earning tips. 📲

          #EarnSmartIndia #OnlineEarning #Freelancing #WorkFromHome
          """

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          request = urllib.request.Request(
              url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise RuntimeError(result)

          print("✅ Telegram post published successfully.")
          PY
