          💰 Pay can be low and task availability can vary.

          ⚠️ Avoid platforms demanding money, OTPs or wallet private keys.
                  """
              },

              {
                  "title": "🚀 Build a Skill, Not a Get-Rich-Quick Scheme",
                  "image": "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=80",
                  "body": """
          <b>💡 The most reliable starting point:</b>
          Build a skill that solves a real problem.

          <b>🎯 Choose one:</b>
          • Writing
          • Design
          • Editing
          • Coding
          • Tutoring
          • Website work
          • Translation

          <b>📈 Simple formula:</b>
          Skill → Portfolio → Clients → Experience → Better Rates

          💰 Income normally grows gradually rather than instantly.

          ⚠️ Be extremely careful with "guaranteed daily income", deposits, OTP requests and private-key requests.

          <b>EarnSmart India:</b> Learn first. Earn legitimately. Grow gradually.
                  """
              }
          ]

          # Rotate automatically by day of year
          post = posts[(now.timetuple().tm_yday - 1) % len(posts)]

          # ---------------------------------------------------------
          # BUILD TELEGRAM CAPTION
          # ---------------------------------------------------------

          caption = f"""💰 <b>EarnSmart India — Daily Earning Tip</b>

          📅 {date}

          <b>{post["title"]}</b>

          {post["body"].strip()}

          📌 <b>Remember:</b>
          There is no guaranteed easy-money method. Legitimate online income normally requires skill, effort and consistency.

          📢 Follow <b>EarnSmart India</b> for practical online earning tips.

          #EarnSmartIndia #OnlineEarning #WorkFromHome #Freelancing #OnlineJobs"""

          # Telegram photo captions have a size limit.
          if len(caption) > 1000:
              caption = caption[:997] + "..."

          url = f"https://api.telegram.org/bot{TOKEN}/sendPhoto"

          data = urllib.parse.urlencode({
              "chat_id": CHAT_ID,
              "photo": post["image"],
              "caption": caption,
              "parse_mode": "HTML",
              "disable_notification": "false"
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/x-www-form-urlencoded"
              }
          )

          # ---------------------------------------------------------
          # RETRY TELEGRAM REQUEST
          # ---------------------------------------------------------

          max_attempts = 3

          for attempt in range(1, max_attempts + 1):

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read().decode("utf-8")
                      result = json.loads(raw)

                  if result.get("ok"):
                      print("✅ Telegram post published successfully.")
                      print("📅 Date:", date)
                      print("📰 Topic:", post["title"])
                      print("🔁 Attempt:", attempt)
                      break

                  raise RuntimeError(
                      "Telegram API returned an error: " + str(result)
                  )

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode("utf-8", errors="replace")

                  print(
                      f"⚠️ Telegram HTTP error "
                      f"{e.code} on attempt {attempt}: {error_body}"
                  )

                  if attempt == max_attempts:
                      raise

                  time.sleep(5 * attempt)

              except Exception as e:

                  print(
                      f"⚠️ Telegram publishing error "
                      f"on attempt {attempt}: {e}"
                  )

                  if attempt == max_attempts:
                      raise

                  time.sleep(5 * attempt)

          PY
