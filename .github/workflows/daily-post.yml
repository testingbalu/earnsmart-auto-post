          # ============================================================
          # HTML ESCAPING
          # ============================================================

          def esc(text):
              return html.escape(str(text), quote=False)


          # ============================================================
          # BUILD TELEGRAM CAPTION
          # ============================================================

          def build_caption(post, date_text):

              lines = []

              lines.append(
                  "💰 <b>EarnSmart India</b>"
              )

              lines.append("")

              lines.append(
                  f"💰 <b>{esc(post['title'])}</b>"
              )

              lines.append("")

              lines.append(
                  esc(post["intro"])
              )

              lines.append("")

              lines.append(
                  "🔷 <b>What it means</b>"
              )

              lines.append("")

              lines.append(
                  esc(post["meaning"])
              )

              lines.append("")

              lines.append(
                  "🔷 <b>How to start</b>"
              )

              lines.append("")

              for number, step in enumerate(
                  post["steps"],
                  start=1
              ):
                  lines.append(
                      f"{number}. {esc(step)}"
                  )

              lines.append("")

              lines.append(
                  "🔷 <b>Important tips</b>"
              )

              lines.append("")

              for tip in post["tips"]:
                  lines.append(
                      f"• {esc(tip)}"
                  )

              lines.append("")

              lines.append(
                  "⚠️ <b>Scam warning</b>"
              )

              lines.append("")

              lines.append(
                  "Never pay money for a guaranteed job or "
                  "guaranteed income. Never share OTPs, passwords "
                  "or sensitive banking information with strangers."
              )

              lines.append("")

              lines.append(
