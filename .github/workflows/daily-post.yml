          set -Eeuo pipefail

          cat > /tmp/daily_post.py <<'PY'
          import os
          import sys
          import time
          import html
          import json
          import random
          import urllib.request
          import urllib.error
          import urllib.parse
          from datetime import datetime, timezone

          # ============================================================
          # CONFIGURATION
          # ============================================================

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          if not CHAT_ID:
              print("ERROR: TELEGRAM_CHAT_ID secret is missing.")
              sys.exit(1)

          TELEGRAM_API = f"https://api.telegram.org/bot{BOT_TOKEN}"

