name: EarnSmart India Daily Post

on:
  workflow_dispatch:

  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/daily_post.py <<'PY'
          import os
          import sys
          import time
          import json
          import html
          import random
          import urllib.request
          import urllib.error
          import urllib.parse
          from datetime import datetime
          from zoneinfo import ZoneInfo


          # ============================================================
          # CONFIGURATION
          # ============================================================

          BOT_TOKEN = os.environ.get(
              "TELEGRAM_BOT_TOKEN",
              ""
          ).strip()

          CHAT_ID = os.environ.get(
              "TELEGRAM_CHAT_ID",
              ""
          ).strip()

          TELEGRAM_API = (
              f"https://api.telegram.org/bot{BOT_TOKEN}"
          )

          TELEGRAM_TIMEOUT = 45
          IMAGE_TIMEOUT = 45
          RETRIES = 3

          # Telegram photo caption maximum is 1024 characters.
          MAX_CAPTION_LENGTH = 1024

          INDIA_TZ = ZoneInfo("Asia/Kolkata")

          IMAGE_PATH = "/tmp/earnsmart_daily.jpg"


          # ============================================================
          # SECRET VALIDATION
          # ============================================================

          if not BOT_TOKEN:
              print(
                  "ERROR: TELEGRAM_BOT_TOKEN secret is missing."
              )
              sys.exit(1)

          if not CHAT_ID:
              print(
                  "ERROR: TELEGRAM_CHAT_ID secret is missing."
              )
              sys.exit(1)


