name: EarnSmart India Daily Post

on:
  workflow_dispatch:

  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # CREATE AND PUBLISH POST
      # ============================================================

      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        shell: bash

        run: |

          set -Eeuo pipefail

          echo "=================================================="
          echo "EarnSmart India Telegram Publisher"
          echo "=================================================="

          cat > /tmp/earnsmart_daily.py <<'PY'

          import os
          import sys
          import json
          import time
          import html
          import random
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURATION
          # ============================================================

          BOT_TOKEN = os.environ.get(
              "TELEGRAM_BOT_TOKEN",
              ""
          ).strip()


          # IMPORTANT:
          # This avoids the previous "CHAT_ID secret missing" problem.
          #
          # If your Telegram channel has another public username,
          # change ONLY this value.
          #
          # Example:
          # CHANNEL = "@MyChannel"
          #
          CHANNEL = "@EarnSmartIndia"


          TELEGRAM_API = (
              f"https://api.telegram.org/bot{BOT_TOKEN}"
          )


          DOWNLOAD_TIMEOUT = 45
          TELEGRAM_TIMEOUT = 60
          RETRIES = 3

          # Telegram photo captions have a limited length.
          MAX_CAPTION = 1000


          # ============================================================
          # VALIDATE BOT TOKEN
          # ============================================================

          if not BOT_TOKEN:

              print(
                  "ERROR: TELEGRAM_BOT_TOKEN secret is missing."
              )

              print(
                  "Go to:"
              )

              print(
                  "GitHub Repository -> Settings -> Secrets and variables "
                  "-> Actions"
              )

              print(
                  "and create TELEGRAM_BOT_TOKEN."
              )

              sys.exit(1)


