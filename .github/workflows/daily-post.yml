                      "Unknown Telegram error"
                  )

                  raise RuntimeError(
                      "Telegram chat verification failed: "
                      + description
                  )

              chat = result.get(
                  "result",
                  {}
              )

              chat_type = chat.get(
                  "type",
                  "unknown"
              )

              chat_title = chat.get(
                  "title",
                  ""
              )

              username = chat.get(
                  "username",
                  ""
              )

              print(
                  f"Chat type : {chat_type}"
              )

              if chat_title:
                  print(
