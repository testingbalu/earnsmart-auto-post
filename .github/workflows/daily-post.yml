              "TELEGRAM_CHAT_ID",
              ""
          ).strip()

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN is empty.")
              sys.exit(1)

          if not CHAT_ID:
              print("ERROR: TELEGRAM_CHAT_ID is empty.")
