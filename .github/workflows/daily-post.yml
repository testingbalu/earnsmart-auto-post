                  "📢 <b>Follow EarnSmart India</b> for practical "
                  "online earning tips.\n\n"
                  "#EarnSmartIndia #OnlineEarning "
                  "#FreelancingIndia #DigitalSkills"
              )

              # Telegram caption maximum is 1024 characters.
              if len(text) > 1024:
                  text = text[:1020] + "..."

              return text


