name: EarnSmart India Daily Post

on:
  workflow_dispatch:

  schedule:
    # 9:15 AM IST = 3:45 AM UTC
    - cron: "45 3 * * *"

permissions:
  contents: read

jobs:
  post-to-telegram:
    name: Publish Daily Post
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ============================================================
      # GENERATE + PUBLISH
      # ============================================================

      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        shell: bash

        run: |

          set -Eeuo pipefail

          echo "=================================================="
          echo "EarnSmart India Telegram Publisher"
          echo "=================================================="

          # ==========================================================
          # VERIFY SECRETS
          # ==========================================================

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          echo "Telegram bot token: OK"
          echo "Gemini API key: OK"

          # ==========================================================
          # CREATE PYTHON SCRIPT
          # ==========================================================

          cat > /tmp/daily_post.py <<'PY'

          import os
          import sys
          import json
          import time
          import html
          import random
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"].strip()

          # IMPORTANT:
          # Keep this exactly as the Telegram destination used by
          # the previously working version.
          TELEGRAM_CHAT = "@LegitEarnIndia"

          TELEGRAM_API = (
              f"https://api.telegram.org/bot{BOT_TOKEN}"
          )

          GEMINI_API = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.5-flash-lite:generateContent"
          )

          MAX_TELEGRAM_MESSAGE = 4096
          TELEGRAM_RETRIES = 3
          TELEGRAM_TIMEOUT = 45
          GEMINI_TIMEOUT = 60


          # ==========================================================
          # TOPIC LIBRARY
          # ==========================================================

          TOPICS = [

              "Legitimate work from home opportunities",

              "How to start freelancing with one skill",

              "How to build a professional freelance portfolio",

              "Best digital skills to learn for online income",

              "How to find legitimate remote jobs",

              "How to avoid online job scams",

              "How to improve your CV for online jobs",

              "How to build a professional LinkedIn profile",

              "How to start a small online service",

              "How to earn through website development",

              "How to learn WordPress skills",

              "How to learn graphic design",

              "How to learn video editing",

              "How to learn digital marketing",

              "How to learn SEO",

              "How to learn Excel for jobs",

              "How to learn data analysis",

              "How to become a virtual assistant",

              "How to start content creation",

              "How to build a YouTube channel",

              "How to learn social media management",

              "How to use AI tools productively",

              "How to learn basic coding",

              "How to build simple automation",

              "How to create digital products",

              "How to improve communication skills",

              "How to develop customer support skills",

              "How to research an employer before applying",

              "How to protect yourself from payment scams",

              "How to identify fake earning apps",

              "How to identify fake investment schemes",

              "How to build multiple income skills",

              "How to turn a skill into a freelance service",

              "How to create a simple online business plan",

              "How to build a consistent learning routine",

              "How to get your first freelance client",

              "How to price a freelance service",

              "How to build trust with online clients",

              "How to create useful educational content",

              "How to improve productivity using digital tools",

              "How to start an online portfolio",

              "How to develop a valuable technical skill",

              "How to find genuine online opportunities",

              "How to avoid advance-fee scams",

              "How to safely receive online payments",

              "How to build sustainable online income",

              "Skills that can improve your career",

              "How to start learning Python",

              "How to start learning JavaScript",

              "How to build simple websites",

          ]


          # ==========================================================
          # UTILITY FUNCTIONS
          # ==========================================================

          def clean(value):
              if value is None:
                  return ""

              return str(value).strip()


          def telegram_escape(value):
              """
              Escape HTML characters for Telegram HTML mode.
              """

              return html.escape(
                  clean(value),
                  quote=False
              )


          def http_json(
              url,
              method="GET",
              data=None,
              headers=None,
              timeout=45
          ):
              """
              Generic JSON HTTP helper.
              """

              request = urllib.request.Request(
                  url=url,
                  data=data,
                  method=method,
                  headers=headers or {},
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:

                  raw = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  return json.loads(raw)


          # ==========================================================
          # GEMINI CONTENT GENERATION
          # ==========================================================

          def generate_post(topic):

              today = datetime.now(
                  timezone.utc
              ).strftime("%d %B %Y")

              prompt = f"""
          You are the content editor for EarnSmart India.

          Create ONE useful daily Telegram post.

          Date:
          {today}

          Topic:
          {topic}

          Requirements:

          1. Write for Indian users.
          2. Use simple English.
          3. Give practical information.
          4. Do not promise guaranteed income.
          5. Do not promote gambling.
          6. Do not promote illegal activity.
          7. Do not invent payment proofs.
          8. Do not make unrealistic income claims.
          9. Warn users about scams where relevant.
          10. Keep the post useful and actionable.
          11. Use Telegram-friendly formatting.
          12. Maximum approximately 2800 characters.
          13. Do not use Markdown tables.
          14. Do not include a fake source.
          15. Do not claim a company is legitimate unless the
              statement is general and verifiable.
          16. End with relevant hashtags.

          Structure:

          💰 TITLE

          Short introduction.

          🔹 What it means

          Explain the topic.

          🔹 How to start

          Give 4-6 practical steps.

          🔹 Important tips

          Give useful advice.

          ⚠️ Scam warning

          Give a short warning if applicable.

          💡 Final tip

          Give one practical takeaway.

          Hashtags:
          #EarnSmartIndia plus 3-5 relevant hashtags.

          Return ONLY the final post text.
          """

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],

                  "generationConfig": {
                      "temperature": 0.7,
                      "topP": 0.9,
                      "maxOutputTokens": 1800
                  }
              }

              data = json.dumps(
                  payload
              ).encode("utf-8")

              headers = {
                  "Content-Type": "application/json",
                  "x-goog-api-key": GEMINI_API_KEY,
                  "User-Agent":
                      "EarnSmartIndia-GitHubActions/2.0",
              }

              for attempt in range(
                  1,
                  4
              ):

                  try:

                      print(
                          f"Gemini attempt "
                          f"{attempt}/3..."
                      )

                      result = http_json(
                          GEMINI_API,
                          method="POST",
                          data=data,
                          headers=headers,
                          timeout=GEMINI_TIMEOUT
                      )

                      candidates = result.get(
                          "candidates",
                          []
                      )

                      if not candidates:
                          raise RuntimeError(
                              "Gemini returned no candidates."
                          )

                      parts = (
                          candidates[0]
                          .get("content", {})
                          .get("parts", [])
                      )

                      text_parts = []

                      for part in parts:

                          text = part.get(
                              "text"
                          )

                          if text:
                              text_parts.append(
                                  text
                              )

                      text = "\n".join(
                          text_parts
                      ).strip()

                      if not text:
                          raise RuntimeError(
                              "Gemini returned empty text."
                          )

                      return text

                  except Exception as exc:

                      print(
                          f"Gemini error: {exc}"
                      )

                      if attempt < 3:
                          time.sleep(
                              attempt * 3
                          )

              raise RuntimeError(
                  "Gemini generation failed."
              )


          # ==========================================================
          # CLEAN GENERATED TEXT
          # ==========================================================

          def prepare_telegram_text(text):

              text = clean(text)

              # Remove accidental Markdown code fences.
              text = text.replace(
                  "```",
                  ""
              ).strip()

              # Telegram HTML mode needs these characters escaped.
              text = html.escape(
                  text,
                  quote=False
              )

              # Convert simple Markdown bold into Telegram HTML.
              text = text.replace(
                  "**",
                  "<b>",
                  1
              ) if text.count("**") >= 2 else text

              if len(text) > MAX_TELEGRAM_MESSAGE:

                  text = (
                      text[
                          :MAX_TELEGRAM_MESSAGE - 100
                      ]
                      .rsplit(
                          "\n",
                          1
                      )[0]
                      .rstrip()
                  )

                  text += (
                      "\n\n"
                      "📢 Follow @LegitEarnIndia"
                  )

              return text


          # ==========================================================
          # TELEGRAM API
          # ==========================================================

          def telegram_send_message(text):

              url = (
                  f"{TELEGRAM_API}/sendMessage"
              )

              payload = {
                  "chat_id": TELEGRAM_CHAT,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
              }

              data = urllib.parse.urlencode(
                  payload
              ).encode("utf-8")

              headers = {
                  "Content-Type":
                      "application/x-www-form-urlencoded",
                  "User-Agent":
                      "EarnSmartIndia-GitHubActions/2.0",
              }

              for attempt in range(
                  1,
                  TELEGRAM_RETRIES + 1
              ):

                  try:

                      print(
                          f"Telegram attempt "
                          f"{attempt}/{TELEGRAM_RETRIES}..."
                      )

                      result = http_json(
                          url,
                          method="POST",
                          data=data,
                          headers=headers,
                          timeout=TELEGRAM_TIMEOUT
                      )

                      print(
                          "Telegram API response:"
                      )

                      print(
                          json.dumps(
                              result,
                              ensure_ascii=False,
                              indent=2
                          )
                      )

                      if result.get("ok"):

                          message = result.get(
                              "result",
                              {}
                          )

                          message_id = message.get(
                              "message_id",
                              "unknown"
                          )

                          print(
                              "SUCCESS: Telegram message "
                              f"published. Message ID: "
                              f"{message_id}"
                          )

                          return True

                      description = result.get(
                          "description",
                          "Unknown Telegram error"
                      )

                      raise RuntimeError(
                          description
                      )

                  except Exception as exc:

                      print(
                          f"Telegram attempt "
                          f"{attempt} failed: {exc}"
                      )

                      if attempt < TELEGRAM_RETRIES:

                          time.sleep(
                              attempt * 4
                          )

              return False


          # ==========================================================
          # TELEGRAM CONNECTION TEST
          # ==========================================================

          def test_bot():

              url = (
                  f"{TELEGRAM_API}/getMe"
              )

              try:

                  result = http_json(
                      url,
                      timeout=30
                  )

                  if not result.get("ok"):

                      raise RuntimeError(
                          result.get(
                              "description",
                              "getMe failed"
                          )
                      )

                  bot = result.get(
                      "result",
                      {}
                  )

                  username = bot.get(
                      "username",
                      "unknown"
                  )

                  print(
                      f"Telegram bot verified: "
                      f"@{username}"
                  )

                  return True

              except Exception as exc:

                  print(
                      f"ERROR: Telegram bot "
                      f"verification failed: {exc}"
                  )

                  return False


          # ==========================================================
          # MAIN
          # ==========================================================

          def main():

              print()
              print(
                  "=================================================="
              )
              print(
                  "EarnSmart India Daily Publisher"
              )
              print(
                  "=================================================="
              )

              # ------------------------------------------------------
              # Telegram bot verification
              # ------------------------------------------------------

              if not test_bot():

                  print(
                      "ERROR: Telegram bot token is invalid "
                      "or Telegram API is unavailable."
                  )

                  sys.exit(1)

              # ------------------------------------------------------
              # Date / topic rotation
              # ------------------------------------------------------

              now = datetime.now(
                  timezone.utc
              )

              day_of_year = (
                  now.timetuple().tm_yday
              )

              topic_index = (
                  day_of_year - 1
              ) % len(TOPICS)

              topic = TOPICS[
                  topic_index
              ]

              print(
                  f"UTC date: "
                  f"{now.strftime('%Y-%m-%d')}"
              )

              print(
                  f"Topic {topic_index + 1}/"
                  f"{len(TOPICS)}:"
              )

              print(topic)

              # ------------------------------------------------------
              # Generate content
              # ------------------------------------------------------

              print()
              print(
                  "Generating daily post..."
              )

              generated = generate_post(
                  topic
              )

              print(
                  f"Generated characters: "
                  f"{len(generated)}"
              )

              # ------------------------------------------------------
              # Prepare Telegram message
              # ------------------------------------------------------

              message = prepare_telegram_text(
                  generated
              )

              print(
                  f"Telegram message characters: "
                  f"{len(message)}"
              )

              # ------------------------------------------------------
              # Publish
              # ------------------------------------------------------

              print()
              print(
                  f"Publishing to: "
                  f"{TELEGRAM_CHAT}"
              )

              success = telegram_send_message(
                  message
              )

              if not success:

                  print()
                  print(
                      "=================================================="
                  )
                  print(
                      "ERROR: Telegram publication failed."
                  )
                  print(
                      "=================================================="
                  )

                  sys.exit(1)

              print()
              print(
                  "=================================================="
              )
              print(
                  "SUCCESS: Daily post published."
              )
              print(
                  "=================================================="
              )


          if __name__ == "__main__":
              main()

          PY

          # ==========================================================
          # SYNTAX CHECK
          # ==========================================================

          echo ""
          echo "Checking Python syntax..."

          python -m py_compile \
            /tmp/daily_post.py

          echo "Python syntax: OK"

          # ==========================================================
          # EXECUTE
          # ==========================================================

          echo ""
          echo "Running publisher..."

          python /tmp/daily_post.py

          echo ""
          echo "Workflow completed successfully."
