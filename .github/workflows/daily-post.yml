name: EarnSmart India Daily Post

"on":
  workflow_dispatch:

  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and publish daily post
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -Eeuo pipefail

          cat > /tmp/daily_post.py <<'PY'
          import os
          import sys
          import json
          import html
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone, timedelta

          # ============================================================
          # CONFIG
          # ============================================================

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          TELEGRAM_CHAT = "@LegitEarnIndia"
          TELEGRAM_API = f"https://api.telegram.org/bot{BOT_TOKEN}"

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN is missing.")
              sys.exit(1)

          if GEMINI_API_KEY:
              print("Gemini API key: FOUND (not used in static mode)")
          else:
              print("Gemini API key: NOT FOUND - using static content")

