name: EarnSmart India Daily Post

on:
  workflow_dispatch:

  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Test and publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@LegitEarnIndia"

        run: |
          cat > telegram_test.py <<'PY'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error
          import uuid

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          print("=" * 60)
          print("EarnSmart India - Telegram Diagnostic")
          print("=" * 60)

          if not TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN is missing.")
              sys.exit(1)

          if not CHAT_ID:
              print("ERROR: TELEGRAM_CHAT_ID is missing.")
              sys.exit(1)

          print("Bot token: FOUND")
          print("Chat ID:", CHAT_ID)

          # ------------------------------------------------------------
          # Telegram API helper
          # ------------------------------------------------------------

          def api_call(method, payload=None):

              url = f"https://api.telegram.org/bot{TOKEN}/{method}"

              try:
                  if payload is None:
                      request = urllib.request.Request(
                          url,
                          method="GET"
                      )
                  else:
                      data = json.dumps(payload).encode("utf-8")

                      request = urllib.request.Request(
                          url,
                          data=data,
                          method="POST",
                          headers={
                              "Content-Type": "application/json"
                          }
                      )

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      raw = response.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      result = json.loads(raw)

                      print(json.dumps(
                          result,
                          indent=2,
                          ensure_ascii=False
                      ))

                      return result

              except urllib.error.HTTPError as error:

                  body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("HTTP ERROR:", error.code)
                  print(body)

                  try:
                      return json.loads(body)
                  except Exception:
                      return {
                          "ok": False,
                          "description": body
                      }

              except Exception as error:

                  print("REQUEST ERROR:", repr(error))

                  return {
                      "ok": False,
                      "description": str(error)
                  }

          # ------------------------------------------------------------
          # STEP 1 - Check bot
          # ------------------------------------------------------------

          print()
          print("=" * 60)
          print("STEP 1 - CHECKING BOT")
          print("=" * 60)

          result = api_call("getMe")

          if not result.get("ok"):
              print("ERROR: Bot token is invalid.")
              sys.exit(1)

          bot = result["result"]

          print("SUCCESS")
          print("Bot ID:", bot.get("id"))
          print("Bot username:", bot.get("username"))
          print("Bot name:", bot.get("first_name"))

          # ------------------------------------------------------------
          # STEP 2 - Check channel
          # ------------------------------------------------------------

          print()
          print("=" * 60)
          print("STEP 2 - CHECKING CHANNEL")
          print("=" * 60)

          result = api_call(
              "getChat",
              {
                  "chat_id": CHAT_ID
              }
          )

          if not result.get("ok"):
              print()
              print("ERROR: Cannot access the Telegram channel.")
              print("Telegram says:")
              print(result.get("description"))
              sys.exit(1)

          chat = result["result"]

          print("SUCCESS")
          print("Channel ID:", chat.get("id"))
          print("Channel title:", chat.get("title"))
          print("Channel username:", chat.get("username"))
          print("Channel type:", chat.get("type"))

          # ------------------------------------------------------------
          # STEP 3 - Check bot administrator status
          # ------------------------------------------------------------

          print()
          print("=" * 60)
          print("STEP 3 - CHECKING BOT ADMIN STATUS")
          print("=" * 60)

          result = api_call(
              "getChatMember",
              {
                  "chat_id": CHAT_ID,
                  "user_id": bot["id"]
              }
          )

          if not result.get("ok"):
              print("ERROR: Cannot check bot membership.")
              print(result.get("description"))
              sys.exit(1)

          member = result["result"]
          status = member.get("status")

          print("Bot status:", status)

          if status != "administrator":

              print()
              print("ERROR: BOT IS NOT ADMINISTRATOR.")
              print()
              print("Open Telegram:")
              print("Channel -> Edit -> Administrators")
              print("Add this bot as administrator.")
              sys.exit(1)

          print("SUCCESS: Bot is administrator.")

          # ------------------------------------------------------------
          # STEP 4 - Send test text
          # ------------------------------------------------------------

          print()
          print("=" * 60)
          print("STEP 4 - SENDING TEST MESSAGE")
          print("=" * 60)

          result = api_call(
              "sendMessage",
              {
                  "chat_id": CHAT_ID,
                  "text": "🧪 EarnSmart India Telegram test message\n\nConnection is working.",
                  "parse_mode": "HTML"
              }
          )

          if not result.get("ok"):

              print()
              print("ERROR: Telegram rejected the message.")
              print("Reason:", result.get("description"))
              sys.exit(1)

          message_id = result["result"].get("message_id")

          print()
          print("SUCCESS!")
          print("Test message ID:", message_id)

          # ------------------------------------------------------------
          # STEP 5 - Download test image
          # ------------------------------------------------------------

          print()
          print("=" * 60)
          print("STEP 5 - DOWNLOADING TEST IMAGE")
          print("=" * 60)

          image_url = "https://picsum.photos/1200/800"

          image_path = "/tmp/earnsmart-test.jpg"

          request = urllib.request.Request(
              image_url,
              headers={
                  "User-Agent": "EarnSmartIndiaBot/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  image_data = response.read()

              if len(image_data) < 1000:
                  print("ERROR: Image is too small.")
                  sys.exit(1)

              with open(image_path, "wb") as image_file:
                  image_file.write(image_data)

              print(
                  "Image downloaded:",
                  len(image_data),
                  "bytes"
              )

          except Exception as error:

              print("ERROR downloading image:")
              print(repr(error))
              sys.exit(1)

          # ------------------------------------------------------------
          # STEP 6 - Send photo
          # ------------------------------------------------------------

          print()
          print("=" * 60)
          print("STEP 6 - SENDING PHOTO")
          print("=" * 60)

          boundary = "----EarnSmartIndia" + uuid.uuid4().hex

          with open(image_path, "rb") as image_file:
              image_data = image_file.read()

          body = bytearray()

          def add_field(name, value):

              body.extend(
                  (
                      f"--{boundary}\r\n"
                      f'Content-Disposition: form-data; name="{name}"\r\n'
                      "\r\n"
                      f"{value}\r\n"
                  ).encode("utf-8")
              )

          def add_file(name, filename, content):

              body.extend(
                  (
                      f"--{boundary}\r\n"
                      f'Content-Disposition: form-data; name="{name}"; '
                      f'filename="{filename}"\r\n'
                      "Content-Type: image/jpeg\r\n"
                      "\r\n"
                  ).encode("utf-8")
              )

              body.extend(content)
              body.extend(b"\r\n")

          add_field("chat_id", CHAT_ID)

          add_field(
              "caption",
              "<b>💰 EarnSmart India</b>\n\n"
              "Daily earning test post.\n\n"
              "#EarnSmartIndia"
          )

          add_field("parse_mode", "HTML")

          add_file(
              "photo",
              "earnsmart-test.jpg",
              image_data
          )

          body.extend(
              f"--{boundary}--\r\n".encode("utf-8")
          )

          photo_url = (
              f"https://api.telegram.org/bot{TOKEN}/sendPhoto"
          )

          request = urllib.request.Request(
              photo_url,
              data=bytes(body),
              method="POST",
              headers={
                  "Content-Type":
                      f"multipart/form-data; boundary={boundary}",
                  "User-Agent":
                      "EarnSmartIndiaBot/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=90
              ) as response:

                  raw = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

              result = json.loads(raw)

              print(
                  json.dumps(
                      result,
                      indent=2,
                      ensure_ascii=False
                  )
              )

          except urllib.error.HTTPError as error:

              error_body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print()
              print("TELEGRAM HTTP ERROR:", error.code)
              print(error_body)
              sys.exit(1)

          except Exception as error:

              print()
              print("PHOTO REQUEST ERROR:")
              print(repr(error))
              sys.exit(1)

          if not result.get("ok"):

              print()
              print("ERROR: Telegram rejected the photo.")
              print("Error code:", result.get("error_code"))
              print("Description:", result.get("description"))
              sys.exit(1)

          print()
          print("=" * 60)
          print("🎉 SUCCESS - PHOTO POSTED TO TELEGRAM")
          print("=" * 60)

          print(
              "Photo message ID:",
              result["result"].get("message_id")
          )
          PY

          echo "Checking Python syntax..."

          python -m py_compile telegram_test.py

          echo "Python syntax: OK"

          echo
          echo "Running Telegram diagnostic..."

          python telegram_test.py
