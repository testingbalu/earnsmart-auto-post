def build_caption(topic):
    """Build enhanced caption with new fields."""
    india_now = datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)
    date_text = india_now.strftime("%d %B %Y")

    # Start with header
    text = (
        "💰 <b>EarnSmart India</b>\n\n"
        f"📅 {date_text}\n\n"
        f"🔥 <b>{esc(topic['title'])}</b>\n\n"
        f"{esc(topic['intro'])}\n\n"
    )

    # Job description
    if 'job_description' in topic:
        text += f"📋 <b>Job Description:</b>\n{esc(topic['job_description'])}\n\n"

    # Required skills
    if 'required_skills' in topic and topic['required_skills']:
        text += "🛠️ <b>Required Skills:</b>\n"
        for skill in topic['required_skills']:
            text += f"• {esc(skill)}\n"
        text += "\n"

    # How to improve skills
    if 'how_to_improve' in topic and topic['how_to_improve']:
        text += "📈 <b>How to Improve Skills:</b>\n"
        for i, item in enumerate(topic['how_to_improve'], 1):
            text += f"{i}. {esc(item)}\n"
        text += "\n"

    # Steps (original "How to start")
    text += "🚀 <b>How to Start:</b>\n"
    for i, step in enumerate(topic['steps'], 1):
        text += f"{i}. {esc(step)}\n"
    text += "\n"

    # Job sources
    if 'job_sources' in topic and topic['job_sources']:
        text += "💼 <b>Legitimate Job Sources:</b>\n"
        text += ", ".join(esc(src) for src in topic['job_sources'])
        text += "\n\n"

    # Genuine links
    if 'genuine_links' in topic and topic['genuine_links']:
        text += "🔗 <b>Useful Links:</b>\n"
        for link in topic['genuine_links']:
            text += f"• {esc(link)}\n"
        text += "\n"

    # Scam warning and footer
    text += (
        "⚠️ <b>Scam Warning</b>\n\n"
        "Never pay money for a guaranteed job or guaranteed income. "
        "Never share OTPs, passwords or sensitive information.\n\n"
        "💡 <b>Remember:</b>\n"
        "Legitimate online income normally requires skills, effort, "
        "consistency and patience.\n\n"
        "📢 <b>Follow EarnSmart India</b> for practical online earning tips.\n\n"
        "#EarnSmartIndia #OnlineEarning #FreelancingIndia #DigitalSkills"
    )

    # Telegram caption limit is 1024 characters
    if len(text) > 1024:
        # Truncate but keep important parts; better to trim links if needed
        text = text[:1020] + "..."
    return text

