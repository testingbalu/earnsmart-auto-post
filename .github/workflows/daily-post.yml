              print("Create this GitHub Actions secret:")
              print("TELEGRAM_CHAT_ID")
              print("")
              print("Example:")
              print("@YourChannelUsername")
              print("")
              print("For a private channel, use the numeric chat ID.")
              sys.exit(1)


