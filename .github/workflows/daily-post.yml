          def request_json(
              url,
              payload=None,
              headers=None,
              timeout=60,
              method="POST"
          ):

              data = None

              if payload is not None:
                  data = json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8")

              request = urllib.request.Request(
                  url=url,
                  data=data,
                  method=method,
                  headers=headers or {}
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=timeout
                  ) as response:

                      raw = response.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      return json.loads(raw)

