name: EarnSmart India Daily Post

on:
  workflow_dispatch:
    inputs:
      post_slot:
        description: "Choose post slot (1=Morning, 2=Afternoon, 3=Evening)"
        required: true
        default: "1"
        type: choice
        options: ["1","2","3"]
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 8 * * *"
    - cron: "30 14 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate and publish selected post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.parse, time
          from datetime import datetime, timezone, timedelta

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = "@LegitEarnIndia"
          API_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"

          def telegram_request(method, params, retries=3, delay=5):
              data = urllib.parse.urlencode(params).encode()
              url = API_URL + "/" + method
              for attempt in range(1, retries+1):
                  try:
                      req = urllib.request.Request(url, data=data)
                      with urllib.request.urlopen(req) as resp:
                          result = json.loads(resp.read().decode())
                          if not result.get("ok"):
                              print(f"Telegram API error: {result}")
                              if attempt < retries:
                                  time.sleep(delay)
                                  continue
                              sys.exit(1)
                          return result
                  except Exception as e:
                      print(f"HTTP error: {e}")
                      if attempt < retries:
                          time.sleep(delay)
                          continue
                      sys.exit(1)

          ist = timezone(timedelta(hours=5, minutes=30))
          today = datetime.now(ist)
          date_str = today.strftime("%d %B %Y")

          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              hour = today.hour
              slot = 0 if hour==9 else 1 if hour==14 else 2
          else:
              slot = int(os.environ.get("INPUT_POST_SLOT","1"))-1

          topics = [
              {
                  "title": "Excel Skills for Office Jobs",
                  "image": "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=85",
                  "content": (
                      f"📅 {date_str}\n\n"
                      "🎯 <b>Excel Skills for Office Jobs</b>\n\n"
                      "📌 <b>What is this work?</b>\n"
                      "Excel is used in Indian offices for data entry, analysis, and reporting.\n\n"
                      "🛠️ <b>Skills required</b>\n"
                      "• Basic formulas (SUM, AVERAGE)\n"
                      "• Pivot tables\n"
                      "• Charts\n\n"
                      "💼 <b>Where to find legitimate work</b>\n"
                      "<a href=\"https://www.naukri.com/excel-jobs\">Naukri</a>\n"
                      "<a href=\"https://www.linkedin.com/jobs/excel\">LinkedIn Jobs</a>\n\n"
                      "💰 <b>Earning reality</b>\n"
                      "Entry‑level Excel jobs in India pay ₹8,000–₹20,000/month.\n\n"
                      "⚠️ <b>Scam warning</b>\n"
                      "Avoid fake 'Excel typing jobs' requiring deposits.\n\n"
                      "🎯 <b>Today's action</b>\n"
                      "Practise SUM and AVERAGE formulas.\n\n"
                      "────────────────\n"
                      "<b>EarnSmart India</b>\n"
                      "Learn • Work • Earn Safely\n"
                      "────────────────"
                  )
              }
              # Add 35 more topics in same safe format
          ]

          day_index = today.timetuple().tm_yday - 1
          start_index = (day_index * 3) % len(topics)
          selected_topic = topics[(start_index + slot) % len(topics)]

          print(f"India date: {date_str}")
          print(f"Post slot: {slot+1}")
          print(f"Selected topic: {selected_topic['title']}")
          print(f"Image URL: {selected_topic['image']}")

          telegram_request("sendPhoto", {
              "chat_id": CHAT_ID,
              "photo": selected_topic["image"],
              "caption": f"📅 {date_str}\n🎯 {selected_topic['title']}",
              "parse_mode": "HTML"
          })

          telegram_request("sendMessage", {
              "chat_id": CHAT_ID,
              "text": selected_topic["content"],
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          })

          print("Telegram post published successfully")
          PY
