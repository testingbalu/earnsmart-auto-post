name: EarnSmart India Daily Post

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cat > telegram_post.py <<'PY'
          import os
          import sys
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = "@LegitEarnIndia"

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          API_URL = "https://api.telegram.org/bot" + BOT_TOKEN

          # Example: send a simple message
          def send_message(text):
              data = urllib.parse.urlencode({"chat_id": CHAT_ID, "text": text}).encode()
              req = urllib.request.Request(API_URL + "/sendMessage", data=data)
              with urllib.request.urlopen(req) as response:
                  print(response.read().decode())

          send_message("✅ Daily post script executed successfully!")
          PY

          python telegram_post.py
