name: EarnSmart India Daily Post

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.parse
          from datetime import datetime

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = "@LegitEarnIndia"
          API_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          def telegram_request(method, params):
              data = urllib.parse.urlencode(params).encode()
              req = urllib.request.Request(API_URL + "/" + method, data=data)
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read().decode()
                      result = json.loads(body)
                      if not result.get("ok"):
                          print(f"Telegram API error: {result}")
                          sys.exit(1)
                      print(f"Telegram API success: message_id={result['result']['message_id']}")
                      return result
              except Exception as e:
                  print(f"HTTP error: {e}")
                  sys.exit(1)

          topics = [
              {
                  "title": "Learn Video Editing",
                  "image": "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=1200&q=85",
                  "content": """🔥 <b>EarnSmart India — Daily Opportunity</b>

<b>Topic: Learn Video Editing</b>

💡 <b>What is it?</b>
Video editors turn raw footage into finished videos for YouTube, Instagram, ads, and business content.

👥 <b>Who can start?</b>
Anyone with interest in media. Beginners can start with free tools.

🛠 <b>Skills required</b>
• Video editing software (CapCut, DaVinci Resolve, Premiere Pro)
• Storytelling
• Audio editing
• Captions & subtitles
• Basic color correction

🚀 <b>How to start</b>
1. Install a free editor (CapCut or DaVinci Resolve).
2. Practise using free stock footage.
3. Create 5 sample videos (e.g., a 30-second reel).
4. Build a showreel portfolio.
5. Offer services to small businesses or creators.

💼 <b>Where to find legitimate work</b>
• <a href="https://www.fiverr.com">Fiverr</a>
• <a href="https://www.upwork.com">Upwork</a>
• LinkedIn Jobs

💰 <b>Earning reality</b>
Beginners often earn ₹5,000–₹15,000 per month depending on workload. Short-form editing (Reels/Shorts) is in high demand.

⚠️ <b>Scam warning</b>
Avoid fake “YouTube monetization” schemes. Never pay for guaranteed jobs or “editing certificates” from unknown sellers.

📅 <b>7-day action plan</b>
Day 1: Learn basics of chosen editor
Day 2: Practise with free footage
Day 3: Create 2 sample reels
Day 4: Build a mini showreel
Day 5: Apply for 2–3 small gigs
Day 6: Network with creators
Day 7: Review progress and improve

🔗 <b>Useful resources</b>
<a href="https://www.blackmagicdesign.com/products/davinciresolve">DaVinci Resolve Official</a>
<a href="https://creatoracademy.youtube.com">YouTube Creator Academy</a>

━━━━━━━━━━━━━━
<b>EarnSmart India</b>
Learn • Work • Earn Safely
━━━━━━━━━━━━━━"""
              }
              # Add other topics here with similar improvements (Freelancing, WordPress, Digital Marketing, Excel, CV, AI, Virtual Assistance, Coding, Digital Products, etc.)
          ]

          index = datetime.now().timetuple().tm_yday % len(topics)
          topic = topics[index]

          telegram_request("sendPhoto", {
              "chat_id": CHAT_ID,
              "photo": topic["image"],
              "caption": f"📅 {datetime.now().strftime('%d %B %Y')}\n<b>{topic['title']}</b>",
              "parse_mode": "HTML"
          })

          telegram_request("sendMessage", {
              "chat_id": CHAT_ID,
              "text": topic["content"],
              "parse_mode": "HTML"
          })
          PY
