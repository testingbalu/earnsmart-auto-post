name: EarnSmart India Daily Post

on:
  workflow_dispatch:
    inputs:
      post_slot:
        description: "Choose post slot for manual testing (1=Morning, 2=Afternoon, 3=Evening)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
    - cron: "30 8 * * *"   # 2:00 PM IST
    - cron: "30 14 * * *"  # 8:00 PM IST

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and publish selected post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.parse, time
          from datetime import datetime, timezone, timedelta

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = "@LegitEarnIndia"
          API_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          def telegram_request(method, params, retries=3, delay=5):
              data = urllib.parse.urlencode(params).encode()
              url = API_URL + "/" + method
              for attempt in range(1, retries+1):
                  try:
                      req = urllib.request.Request(url, data=data)
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read().decode()
                          result = json.loads(body)
                          if not result.get("ok"):
                              print(f"Telegram API error (attempt {attempt}): {result}")
                              if attempt < retries:
                                  time.sleep(delay)
                                  continue
                              sys.exit(1)
                          print(f"Telegram API success: message_id={result['result']['message_id']}")
                          return result
                  except Exception as e:
                      print(f"HTTP error (attempt {attempt}): {e}")
                      if attempt < retries:
                          time.sleep(delay)
                          continue
                      sys.exit(1)

          # Asia/Kolkata date
          ist = timezone(timedelta(hours=5, minutes=30))
          today = datetime.now(ist)
          date_str = today.strftime("%d %B %Y")

          # Determine post slot
          slot = None
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              hour = today.hour
              if hour == 9:
                  slot = 0
              elif hour == 14:
                  slot = 1
              elif hour == 20:
                  slot = 2
          else:
              slot = int(os.environ.get("INPUT_POST_SLOT", "1")) - 1

          # Topic database (36 topics, abbreviated here for brevity)
          topics = [
              {"title":"Freelancing for Beginners","image":"https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=1200&q=85","content":"..."},
              {"title":"Learn Video Editing","image":"https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=1200&q=85","content":"..."},
              {"title":"WordPress Development","image":"https://images.unsplash.com/photo-1547658719-da2b51169166?auto=format&fit=crop&w=1200&q=85","content":"..."},
              {"title":"Canva Graphic Design","image":"https://images.unsplash.com/photo-1581090700227-4c4f7a3d3f4b?auto=format&fit=crop&w=1200&q=85","content":"..."},
              {"title":"Digital Marketing","image":"https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&q=85","content":"..."},
              {"title":"Excel Skills","image":"https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=85","content":"..."},
              # ... continue until 36 topics (Virtual Assistance, Content Writing, Translation, Data Entry, Web Development, Python, JavaScript, SEO, Social Media, YouTube, Resume, Tutoring, Remote Support, AI Services, Digital Products, Affiliate Marketing, Blogging, E-commerce, Local Business, No-code, Mobile Apps, Research, Bookkeeping, PPT Design, Audio Editing, Transcription, Photography, Online Courses, Scam Awareness)
          ]

          # Rotation logic
          day_index = today.timetuple().tm_yday - 1
          start_index = (day_index * 3) % len(topics)
          selected_topic = topics[(start_index + slot) % len(topics)]

          print(f"India date: {date_str}")
          print(f"Post slot: {slot+1}")
          print(f"Selected topic: {selected_topic['title']}")
          print(f"Image URL: {selected_topic['image']}")
          print("Preparing post...")

          # Send image with short caption
          telegram_request("sendPhoto", {
              "chat_id": CHAT_ID,
              "photo": selected_topic["image"],
              "caption": f"📅 {date_str}\n🎯 {selected_topic['title']}",
              "parse_mode": "HTML"
          })

          # Send detailed message separately
          telegram_request("sendMessage", {
              "chat_id": CHAT_ID,
              "text": selected_topic["content"],
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          })

          print("Telegram post published successfully")
          PY
