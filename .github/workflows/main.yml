name: EarnSmart India Daily Post

on:
  workflow_dispatch:
    inputs:
      post_slot:
        description: "Choose post slot for manual testing (1=Morning, 2=Afternoon, 3=Evening)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
    - cron: "30 8 * * *"   # 2:00 PM IST
    - cron: "30 14 * * *"  # 8:00 PM IST

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and publish selected post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.parse, time
          from datetime import datetime, timezone, timedelta

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = "@LegitEarnIndia"
          API_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          def telegram_request(method, params, retries=3, delay=5):
              data = urllib.parse.urlencode(params).encode()
              url = API_URL + "/" + method
              for attempt in range(1, retries+1):
                  try:
                      req = urllib.request.Request(url, data=data)
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read().decode()
                          result = json.loads(body)
                          if not result.get("ok"):
                              print(f"Telegram API error (attempt {attempt}): {result}")
                              if attempt < retries:
                                  time.sleep(delay)
                                  continue
                              sys.exit(1)
                          print(f"Telegram API success: message_id={result['result']['message_id']}")
                          return result
                  except Exception as e:
                      print(f"HTTP error (attempt {attempt}): {e}")
                      if attempt < retries:
                          time.sleep(delay)
                          continue
                      sys.exit(1)

          # Asia/Kolkata date
          ist = timezone(timedelta(hours=5, minutes=30))
          today = datetime.now(ist)
          date_str = today.strftime("%d %B %Y")

          # Determine post slot
          slot = None
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              hour = today.hour
              if hour == 9:
                  slot = 0
              elif hour == 14:
                  slot = 1
              elif hour == 20:
                  slot = 2
          else:
              slot = int(os.environ.get("INPUT_POST_SLOT", "1")) - 1

          # Example topic database (abbreviated — expand to 36 topics)
          topics = [
              {
                  "title": "Freelancing for Beginners",
                  "image": "https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=1200&q=85",
                  "content": f"""📅 {date_str}

🎯 <b>Freelancing for Beginners</b>

📌 <b>What is this work?</b>
Offer one skill as a service online.

🛠️ <b>Skills required</b>
• Communication
• Time management
• Proposal writing

🚀 <b>How to start</b>
1. Pick one skill
2. Practise daily
3. Build 3 sample projects
4. Create a portfolio
5. Apply only for relevant jobs

💼 <b>Where to find legitimate work</b>
• <a href="https://www.upwork.com">Upwork</a>
• <a href="https://www.fiverr.com">Fiverr</a>
• <a href="https://www.freelancer.com">Freelancer</a>
• <a href="https://www.naukri.com/freelance-jobs">Naukri India</a>

💰 <b>Earning reality</b>
Beginners in India often earn ₹5,000–₹15,000 per month depending on workload.

⚠️ <b>Scam warning</b>
Never pay deposits to unlock jobs. Never share OTP, UPI PIN, or bank passwords.

📅 <b>7-day action plan</b>
Day 1: Practise
Day 2: Build sample
Day 3: Portfolio
Day 4: Apply
Day 5: Improve
Day 6: Network
Day 7: Review progress

🔗 <b>Useful resources</b>
• <a href="https://www.freelancer.com">Freelancer</a>
• <a href="https://www.upwork.com/resources">Upwork Resources</a>

🎯 <b>Today's action</b>
Create your first sample project.

────────────────
<b>EarnSmart India</b>
Learn • Work • Earn Safely
────────────────"""
              },
              {
                  "title": "Learn Video Editing",
                  "image": "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=1200&q=85",
                  "content": f"""📅 {date_str}

🎯 <b>Learn Video Editing</b>

📌 <b>What is this work?</b>
Video editors turn raw footage into finished videos.

🛠️ <b>Skills required</b>
• Video editing software
• Storytelling
• Audio editing
• Captions

🚀 <b>How to start</b>
1. Install CapCut or DaVinci Resolve
2. Practise with free footage
3. Create 5 sample videos
4. Build a showreel
5. Offer services to creators

💼 <b>Where to find legitimate work</b>
• <a href="https://www.fiverr.com/categories/video-animation/video-editing">Fiverr</a>
• <a href="https://www.upwork.com/freelance-jobs/video-editing/">Upwork</a>
• <a href="https://www.linkedin.com/jobs/">LinkedIn Jobs</a>

💰 <b>Earning reality</b>
Beginners in India often earn ₹5,000–₹15,000 per month depending on workload.

⚠️ <b>Scam warning</b>
Avoid fake “YouTube monetization” schemes.

📅 <b>7-day action plan</b>
Day 1: Learn basics
Day 2: Practise
Day 3: Create samples
Day 4: Build showreel
Day 5: Apply
Day 6: Network
Day 7: Review progress

🔗 <b>Useful resources</b>
• <a href="https://www.blackmagicdesign.com/products/davinciresolve">DaVinci Resolve Official</a>
• <a href="https://creatoracademy.youtube.com">YouTube Creator Academy</a>

🎯 <b>Today's action</b>
Edit a 30‑second reel.

────────────────
<b>EarnSmart India</b>
Learn • Work • Earn Safely
────────────────"""
              }
              # Expand to 36 topics in same format
          ]

          # Rotation logic
          day_index = today.timetuple().tm_yday - 1
          start_index = (day_index * 3) % len(topics)
          selected_topic = topics[(start_index + slot) % len(topics)]

          print(f"India date: {date_str}")
          print(f"Post slot: {slot+1}")
          print(f"Selected topic: {selected_topic['title']}")
          print(f"Image URL: {selected_topic['image']}")
          print("Preparing post...")

          # Send image with short caption
          print("Sending image with short caption...")
          telegram_request("sendPhoto", {
              "chat_id": CHAT_ID,
              "photo": selected_topic["image"],
              "caption": f"📅 {date_str}\n🎯 {selected_topic['title']}",
              "parse_mode": "HTML"
          })

          # Send detailed message separately
          print("Sending detailed message...")
          telegram_request("sendMessage", {
              "chat_id": CHAT_ID,
              "text": selected_topic["content"],
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          })

          print("Telegram post published successfully")
          PY
