name: EarnSmart India Daily Post

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.parse
          from datetime import datetime

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = "@LegitEarnIndia"
          API_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          def telegram_request(method, params):
              data = urllib.parse.urlencode(params).encode()
              req = urllib.request.Request(API_URL + "/" + method, data=data)
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read().decode()
                      result = json.loads(body)
                      if not result.get("ok"):
                          print(f"Telegram API error: {result}")
                          sys.exit(1)
                      print(f"Telegram API success: message_id={result['result']['message_id']}")
                      return result
              except Exception as e:
                  print(f"HTTP error: {e}")
                  sys.exit(1)

          topics = [
              {
                  "title": "Learn Video Editing",
                  "image": "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=1200&q=85",
                  "content": (
                      "🔥 <b>EarnSmart India — Daily Opportunity</b>\n\n"
                      "<b>Topic: Learn Video Editing</b>\n\n"
                      "💡 <b>What is it?</b>\n"
                      "Video editors turn raw footage into finished videos for YouTube, Instagram, ads, and business content.\n\n"
                      "👥 <b>Who can start?</b>\n"
                      "Anyone with interest in media. Beginners can start with free tools.\n\n"
                      "🛠 <b>Skills required</b>\n"
                      "• Video editing software (CapCut, DaVinci Resolve, Premiere Pro)\n"
                      "• Storytelling\n"
                      "• Audio editing\n"
                      "• Captions & subtitles\n"
                      "• Basic color correction\n\n"
                      "🚀 <b>How to start</b>\n"
                      "1. Install a free editor (CapCut or DaVinci Resolve).\n"
                      "2. Practise using free stock footage.\n"
                      "3. Create 5 sample videos (e.g., a 30-second reel).\n"
                      "4. Build a showreel portfolio.\n"
                      "5. Offer services to small businesses or creators.\n\n"
                      "💼 <b>Where to find legitimate work</b>\n"
                      "• <a href=\"https://www.fiverr.com\">Fiverr</a>\n"
                      "• <a href=\"https://www.upwork.com\">Upwork</a>\n"
                      "• LinkedIn Jobs\n\n"
                      "💰 <b>Earning reality</b>\n"
                      "Beginners often earn ₹5,000–₹15,000 per month depending on workload. Short-form editing (Reels/Shorts) is in high demand.\n\n"
                      "⚠️ <b>Scam warning</b>\n"
                      "Avoid fake “YouTube monetization” schemes. Never pay for guaranteed jobs or “editing certificates” from unknown sellers.\n\n"
                      "📅 <b>7-day action plan</b>\n"
                      "Day 1: Learn basics of chosen editor\n"
                      "Day 2: Practise with free footage\n"
                      "Day 3: Create 2 sample reels\n"
                      "Day 4: Build a mini showreel\n"
                      "Day 5: Apply for 2–3 small gigs\n"
                      "Day 6: Network with creators\n"
                      "Day 7: Review progress and improve\n\n"
                      "🔗 <b>Useful resources</b>\n"
                      "<a href=\"https://www.blackmagicdesign.com/products/davinciresolve\">DaVinci Resolve Official</a>\n"
                      "<a href=\"https://creatoracademy.youtube.com\">YouTube Creator Academy</a>\n\n"
                      "━━━━━━━━━━━━━━\n"
                      "<b>EarnSmart India</b>\n"
                      "Learn • Work • Earn Safely\n"
                      "━━━━━━━━━━━━━━"
                  )
              }
          ]

          index = datetime.now().timetuple().tm_yday % len(topics)
          topic = topics[index]

          telegram_request("sendPhoto", {
              "chat_id": CHAT_ID,
              "photo": topic["image"],
              "caption": f"📅 {datetime.now().strftime('%d %B %Y')}\n<b>{topic['title']}</b>",
              "parse_mode": "HTML"
          })

          telegram_request("sendMessage", {
              "chat_id": CHAT_ID,
              "text": topic["content"],
              "parse_mode": "HTML"
          })
          PY
