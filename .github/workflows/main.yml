name: EarnSmart India Daily Post

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.parse
          from datetime import datetime

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = "@LegitEarnIndia"
          API_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"

          if not BOT_TOKEN:
              print("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
              sys.exit(1)

          def telegram_request(method, params):
              data = urllib.parse.urlencode(params).encode()
              req = urllib.request.Request(API_URL + "/" + method, data=data)
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read().decode()
                      result = json.loads(body)
                      if not result.get("ok"):
                          print(f"Telegram API error: {result}")
                          sys.exit(1)
                      print(f"Telegram API success: message_id={result['result']['message_id']}")
                      return result
              except Exception as e:
                  print(f"HTTP error: {e}")
                  sys.exit(1)

          topics = [
              {"title": "Start Freelancing With One Skill", "image": "https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=1200&q=85", "content": "🔥 <b>EarnSmart India — Daily Opportunity</b>\n\n<b>Topic: Start Freelancing With One Skill</b>\n\n💡 <b>What is it?</b>\nFreelancing means offering one skill as a service.\n\n👤 <b>Who can start?</b>\nBeginners with one marketable skill.\n\n🛠 <b>Skills required</b>\n• Communication\n• Time management\n• Proposal writing\n\n🚀 <b>How to start</b>\n1. Pick one skill\n2. Practise daily\n3. Build 3 sample projects\n4. Create a portfolio\n5. Apply only for relevant jobs\n\n💼 <b>Where to find legitimate work</b>\n• <a href=\"https://www.upwork.com\">Upwork</a>\n• <a href=\"https://www.fiverr.com\">Fiverr</a>\n• <a href=\"https://www.freelancer.com\">Freelancer</a>\n\n💰 <b>Earning reality</b>\nIncome varies by skill, experience, and workload.\n\n⚠️ <b>Scam warning</b>\nNever pay deposits to unlock jobs.\n\n📅 <b>7-day action plan</b>\nDay 1: Practise\nDay 2: Build sample\nDay 3: Portfolio\nDay 4: Apply\nDay 5: Improve\nDay 6: Network\nDay 7: Review progress\n\n━━━━━━━━━━━━━━\n<b>EarnSmart India</b>\nLearn • Work • Earn Safely\n━━━━━━━━━━━━━━"},
              {"title": "Learn WordPress Website Development", "image": "https://images.unsplash.com/photo-1547658719-da2b51169166?auto=format&fit=crop&w=1200&q=85", "content": "🔥 <b>EarnSmart India — Daily Opportunity</b>\n\n<b>Topic: Learn WordPress Website Development</b>\n\n💡 <b>What is it?</b>\nWordPress developers build and maintain websites.\n\n👤 <b>Who can start?</b>\nAnyone with basic computer skills.\n\n🛠 <b>Skills required</b>\n• WordPress admin\n• HTML/CSS basics\n• Basic PHP\n• SEO fundamentals\n\n🚀 <b>How to start</b>\n1. Learn WordPress fundamentals\n2. Create 2–3 practice sites\n3. Learn one page builder\n4. Build a portfolio\n\n💼 <b>Where to find legitimate work</b>\n• <a href=\"https://www.upwork.com\">Upwork</a>\n• <a href=\"https://www.fiverr.com\">Fiverr</a>\n• <a href=\"https://www.codeable.io\">Codeable</a>\n\n💰 <b>Earning reality</b>\nBeginners start with small fixes, income grows with experience.\n\n⚠️ <b>Scam warning</b>\nAvoid fake “premium plugin” sellers.\n\n📅 <b>7-day action plan</b>\nDay 1: Learn basics\nDay 2: Practise\nDay 3: Build demo site\nDay 4: Learn SEO\nDay 5: Portfolio\nDay 6: Apply\nDay 7: Review progress\n\n━━━━━━━━━━━━━━\n<b>EarnSmart India</b>\nLearn • Work • Earn Safely\n━━━━━━━━━━━━━━"},
              {"title": "Learn Video Editing", "image": "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=1200&q=85", "content": "🔥 <b>EarnSmart India — Daily Opportunity</b>\n\n<b>Topic: Learn Video Editing</b>\n\n💡 <b>What is it?</b>\nVideo editors turn raw footage into finished videos.\n\n👤 <b>Who can start?</b>\nAnyone with interest in media.\n\n🛠 <b>Skills required</b>\n• Video editing software\n• Storytelling\n• Audio editing\n• Captions\n\n🚀 <b>How to start</b>\n1. Learn CapCut or DaVinci Resolve\n2. Practise with free footage\n3. Create 5 sample videos\n4. Build a showreel\n5. Offer services to creators\n\n💼 <b>Where to find legitimate work</b>\n• <a href=\"https://www.fiverr.com\">Fiverr</a>\n• <a href=\"https://www.upwork.com\">Upwork</a>\n• LinkedIn\n\n💰 <b>Earning reality</b>\nShort-form editing is in demand.\n\n⚠️ <b>Scam warning</b>\nAvoid fake “YouTube monetization” schemes.\n\n📅 <b>7-day action plan</b>\nDay 1: Learn basics\nDay 2: Practise\nDay 3: Create samples\nDay 4: Build showreel\nDay 5: Apply\nDay 6: Network\nDay 7: Review progress\n\n━━━━━━━━━━━━━━\n<b>EarnSmart India</b>\nLearn • Work • Earn Safely\n━━━━━━━━━━━━━━"},
              # ... continue adding all 20 topics (Digital Marketing, Excel, CV, AI Productivity, Virtual Assistance, Coding, Digital Products, YouTube, Content Writing, Tutoring, Translation, Customer Support, Government Jobs, Scam Awareness, etc.)
          ]

          index = datetime.now().timetuple().tm_yday % len(topics)
          topic = topics[index]

          telegram_request("sendPhoto", {
              "chat_id": CHAT_ID,
              "photo": topic["image"],
              "caption": f"📅 {datetime.now().strftime('%d %B %Y')}\n<b>{topic['title']}</b>",
              "parse_mode": "HTML"
          })

          telegram_request("sendMessage", {
              "chat_id": CHAT_ID,
              "text": topic["content"],
              "parse_mode": "HTML"
          })
          PY
